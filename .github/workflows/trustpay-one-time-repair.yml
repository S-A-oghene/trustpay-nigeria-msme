name: TrustPay One-Time Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Apply consolidated repository repairs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Upgrade npm
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version

      - name: Apply consolidated source and CI repairs
        shell: bash
        env:
          TRUSTPAY_REPAIR_PAYLOAD: 
        run: |
          set -euo pipefail
          printf '%s' "$TRUSTPAY_REPAIR_PAYLOAD" | base64 --decode > /tmp/trustpay-repair.json
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const root = process.cwd()
          const payload = JSON.parse(fs.readFileSync('/tmp/trustpay-repair.json', 'utf8'))

          for (const [relativePath, encoded] of Object.entries(payload)) {
            const fullPath = path.join(root, relativePath)
            fs.mkdirSync(path.dirname(fullPath), { recursive: true })
            fs.writeFileSync(fullPath, Buffer.from(encoded, 'base64').toString('utf8'))
          }

          for (const relativePath of ['.githtrustpay-ci.yml', 'github', 'tools/typecheck-shims.d.ts']) {
            fs.rmSync(path.join(root, relativePath), { recursive: true, force: true })
          }

          const packagePath = path.join(root, 'package.json')
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          packageJson.packageManager = 'npm@11.19.1'
          packageJson.scripts = {
            ...packageJson.scripts,
            check: 'npm run verify:repo && npm run typecheck && npm run lint && npm run test && npm run build',
          }
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`, 'utf8')
          NODE

      - name: Install dependencies and generate the lockfile
        run: npm install

      - name: Run full validation and show every stage
        shell: bash
        run: |
          set +e
          RESULTS=()

          run_check() {
            local name="$1"
            shift
            echo
            echo "=============================="
            echo "CHECK: ${name}"
            echo "=============================="
            "$@"
            local code=$?
            RESULTS+=("${name}=${code}")
            return 0
          }

          run_check "security-audit" npm audit --audit-level=high
          run_check "verify:repo" npm run verify:repo
          run_check "typecheck:core" npm run typecheck:core
          run_check "typecheck:static" npm run typecheck:static
          run_check "typecheck" npm run typecheck
          run_check "lint" npm run lint
          run_check "test" npm run test
          run_check "test:core" npm run test:core
          run_check "build" npm run build

          if [ -f "playwright.config.ts" ]; then
            echo
            echo "=============================="
            echo "CHECK: playwright install"
            echo "=============================="
            npx playwright install --with-deps chromium
            PLAYWRIGHT_CODE=$?
            RESULTS+=("playwright-install=${PLAYWRIGHT_CODE}")
            if [ "${PLAYWRIGHT_CODE}" -eq 0 ]; then
              run_check "e2e" npm run e2e
            else
              RESULTS+=("e2e=SKIPPED")
            fi
          fi

          echo
          echo "=============================="
          echo "VALIDATION SUMMARY"
          echo "=============================="

          for result in "${RESULTS[@]}"; do
            echo "${result}"
          done

          exit 0

      - name: Commit repaired repository and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trustpay-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/trustpay-one-time-repair.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes were produced."
            exit 0
          fi
          git commit -m "fix: consolidate TrustPay repository repairs"
          git push
