name: TrustPay R1 Release Gate

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact Vercel Preview URL for the current R1 deployment"
        required: true
        type: string

      apply_remote_migrations:
        description: "Apply repository migrations to the configured TrustPay Supabase project"
        required: true
        type: boolean
        default: false

      confirm_target:
        description: "Type TRUSTPAY-R1-SUPABASE-APPLY only when intentionally applying migrations"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: trustpay-r1-release-gate
  cancel-in-progress: true

jobs:

  release-gate:

    name: TrustPay R1 Complete Gate

    runs-on: ubuntu-latest

    # ==========================================================
    # JOB-LEVEL ENVIRONMENT
    #
    # These values are intentionally defined here instead of
    # inside individual steps.
    #
    # This means every Supabase command in this job receives:
    #
    # SUPABASE_ACCESS_TOKEN
    # SUPABASE_DB_PASSWORD
    # SUPABASE_PROJECT_ID
    #
    # This prevents the earlier:
    #
    # "Access token not provided"
    #
    # problem from returning in a later Supabase step.
    # ==========================================================

    env:

      R1_BRANCH: v2.0.0-execution-r1

      NODE_VERSION: "22"

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:

      # ========================================================
      # 1. CHECK OUT THE ACTUAL R1 APPLICATION BRANCH
      # ========================================================

      - name: Checkout R1 branch
        uses: actions/checkout@v4
        with:
          ref: v2.0.0-execution-r1
          fetch-depth: 0

      # ========================================================
      # 2. VERIFY THE CHECKED-OUT COMMIT
      # ========================================================

      - name: Verify R1 branch and commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected R1 branch:"
          echo "${R1_BRANCH}"

          echo
          echo "Actual commit:"
          git rev-parse HEAD

          echo
          echo "Recent commits:"
          git log -5 --oneline

          echo
          echo "Checking package.json..."

          test -f package.json || {
            echo "::error::package.json was not found."
            exit 1
          }

      # ========================================================
      # 3. NODE.JS
      # ========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ========================================================
      # 4. DETERMINISTIC DEPENDENCY INSTALLATION
      # ========================================================

      - name: Install dependencies from lockfile
        run: npm ci

      # ========================================================
      # 5. SECURITY AUDIT
      # ========================================================

      - name: Security audit
        run: npm audit --audit-level=high

      # ========================================================
      # 6. TYPECHECKS
      # ========================================================

      - name: Core typecheck
        run: npm run typecheck:core --if-present

      - name: Static typecheck
        run: npm run typecheck:static --if-present

      - name: Application typecheck
        run: npm run typecheck --if-present

      # ========================================================
      # 7. LINT
      # ========================================================

      - name: Lint
        run: npm run lint --if-present

      # ========================================================
      # 8. UNIT + INTEGRATION TESTS
      # ========================================================

      - name: Unit and integration tests
        run: npm run test --if-present

      # ========================================================
      # 9. CORE SMOKE
      # ========================================================

      - name: Core smoke
        run: npm run test:core --if-present

      # ========================================================
      # 10. V2 DETERMINISTIC SMOKE
      # ========================================================

      - name: V2 deterministic smoke
        run: node scripts/v2-smoke.cjs

      # ========================================================
      # 11. PRODUCTION BUILD
      # ========================================================

      - name: Production build
        run: npm run build

      # ========================================================
      # 12. PLAYWRIGHT
      # ========================================================

      - name: Install Playwright Chromium
        if: hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        if: hashFiles('playwright.config.*') != ''
        run: npm run e2e --if-present

      # ========================================================
      # 13. SUPABASE CLI
      # ========================================================

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.117.0"

      # ========================================================
      # 14. CREDENTIAL PRECHECK
      #
      # This catches the two previous Supabase failures:
      #
      # A. Missing token
      # B. Wrong token type
      #
      # IMPORTANT:
      # The token VALUE itself is never printed.
      # ========================================================

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase automation credentials..."

          # -----------------------------------------------------
          # ACCESS TOKEN
          # -----------------------------------------------------

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then

            echo "::error::SUPABASE_ACCESS_TOKEN is missing."

            echo "::error::Create/update a GitHub Actions secret named exactly:"
            echo "::error::SUPABASE_ACCESS_TOKEN"

            exit 1

          fi

          # -----------------------------------------------------
          # CURRENT SUPABASE CLI PAT FORMAT
          #
          # Current personal access tokens begin with:
          #
          # sbp_
          # -----------------------------------------------------

          if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_[^[:space:]]+$ ]]; then

            echo "::error::SUPABASE_ACCESS_TOKEN has an invalid format."

            echo "::error::It must be a Supabase personal access token beginning with sbp_."

            echo "::error::Do NOT use:"
            echo "::error::- publishable key"
            echo "::error::- secret/service-role key"
            echo "::error::- database password"
            echo "::error::- project API key"

            exit 1

          fi

          # -----------------------------------------------------
          # DATABASE PASSWORD
          # -----------------------------------------------------

          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then

            echo "::error::SUPABASE_DB_PASSWORD is missing."

            exit 1

          fi

          # -----------------------------------------------------
          # PROJECT REFERENCE
          # -----------------------------------------------------

          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then

            echo "::error::SUPABASE_PROJECT_ID is missing."

            exit 1

          fi

          # -----------------------------------------------------
          # VERCEL AUTOMATION SECRET
          # -----------------------------------------------------

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then

            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."

            exit 1

          fi

          echo
          echo "Supabase credential preflight: PASS"

          echo "Vercel automation credential preflight: PASS"

      # ========================================================
      # 15. SHOW SUPABASE CLI VERSION
      # ========================================================

      - name: Verify Supabase CLI
        run: |
          set -euo pipefail

          supabase --version

      # ========================================================
      # 16. LINK THE EXISTING TRUSTPAY SUPABASE PROJECT
      #
      # Authentication comes from JOB-LEVEL env.
      # ========================================================

      - name: Link TrustPay Supabase project
        shell: bash
        run: |
          set -euo pipefail

          echo "Linking TrustPay Supabase project..."

          supabase link \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --password "${SUPABASE_DB_PASSWORD}"

          echo "Supabase link: PASS"

      # ========================================================
      # 17. REMOTE MIGRATION STATE
      # ========================================================

      - name: Show Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          echo "Remote/local migration comparison:"

          supabase migration list

      # ========================================================
      # 18. REMOTE MIGRATION DRY RUN
      #
      # This MUST NOT modify the database.
      # ========================================================

      - name: Supabase migration dry run
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Supabase migration dry run..."

          supabase db push --dry-run

          echo "Supabase migration dry run: PASS"

      # ========================================================
      # 19. OPTIONAL REAL MIGRATION APPLY
      # ========================================================

      - name: Apply Supabase migrations
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then

            echo "::error::Remote migration application was requested."

            echo "::error::The required confirmation text was not supplied correctly."

            echo "::error::Required exact text:"
            echo "::error::TRUSTPAY-R1-SUPABASE-APPLY"

            exit 1

          fi

          echo "Applying approved R1 migrations..."

          supabase db push

          echo "Supabase migration apply: PASS"

      # ========================================================
      # 20. VERIFY FINAL MIGRATION STATE
      # ========================================================

      - name: Confirm final Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          echo "Final migration state:"

          supabase migration list

      # ========================================================
      # 21. IMPORTANT FIX:
      #
      # `supabase db lint`
      #
      # means LOCAL database by default.
      #
      # `supabase db lint --linked`
      #
      # means the linked REMOTE project.
      #
      # This is the direct fix for:
      #
      # ECONNREFUSED 127.0.0.1:54322
      # ========================================================

      - name: Lint linked TrustPay Supabase database
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Supabase database lint against the LINKED remote TrustPay project..."

          supabase db lint \
            --linked \
            --fail-on error

          echo "Linked Supabase database lint: PASS"

      # ========================================================
      # 22. PROTECTED VERCEL PREVIEW SMOKE
      # ========================================================


      # ========================================================
      # 23. RECORD R1 EVIDENCE
      # ========================================================

      - name: Record R1 evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          R1_SHA="$(git rev-parse HEAD)"

          {
            echo "TRUSTPAY R1 RELEASE EVIDENCE"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "R1_BRANCH=${R1_BRANCH}"
            echo "R1_SHA=${R1_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "PREVIEW_URL=${{ inputs.preview_url }}"
            echo "REMOTE_MIGRATIONS_APPLIED=${{ inputs.apply_remote_migrations }}"
            echo "SUPABASE_LINT_MODE=linked"
          } > .r1-evidence/context.txt

      # ========================================================
      # PROTECTED VERCEL PREVIEW SMOKE
      #
      # This test checks the real TrustPay Vercel Preview.
      #
      # IMPORTANT:
      #
      # We intentionally use only:
      #
      #   x-vercel-protection-bypass
      #
      # We do NOT use:
      #
      #   x-vercel-set-bypass-cookie
      #
      # in this simple HTTP smoke test.
      #
      # The cookie-setting header can intentionally cause a
      # redirect. That was the reason the previous test saw
      # HTTP 307.
      #
      # This test also uses curl instead of an embedded Python
      # script. This removes the broken heredoc problem.
      # ========================================================

      - name: Protected Vercel Preview smoke
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "TRUSTPAY R1 VERCEL PREVIEW SMOKE"
          echo "=============================================="
          echo

          # ----------------------------------------------------
          # Check that a Preview URL was supplied.
          # ----------------------------------------------------

          if [[ -z "${PREVIEW_URL:-}" ]]; then
            echo "::error::No Vercel Preview URL was supplied."
            echo "::error::When starting the workflow, enter the exact TrustPay R1 Preview URL."
            exit 1
          fi

          # ----------------------------------------------------
          # Check that the Vercel automation secret exists.
          # ----------------------------------------------------

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."
            echo "::error::Go to GitHub → Settings → Secrets and variables → Actions."
            echo "::error::Create/update the repository secret named:"
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET"
            exit 1
          fi

          # ----------------------------------------------------
          # Remove a trailing slash so we add exactly one slash.
          # ----------------------------------------------------

          PREVIEW_URL="${PREVIEW_URL%/}"

          # ----------------------------------------------------
          # The Preview must use HTTPS.
          # ----------------------------------------------------

          if [[ "${PREVIEW_URL}" != https://* ]]; then
            echo "::error::The Preview URL must begin with https://"
            echo "::error::Example:"
            echo "::error::https://trustpay-nigeria-msme-xxxxx.vercel.app"
            exit 1
          fi

          # ----------------------------------------------------
          # Temporary files.
          #
          # These exist only during this GitHub Actions job.
          # ----------------------------------------------------

          BODY_FILE="$(mktemp)"
          HEADER_FILE="$(mktemp)"

          cleanup() {
            rm -f "${BODY_FILE}" "${HEADER_FILE}"
          }

          trap cleanup EXIT

          # ----------------------------------------------------
          # Make the protected request.
          #
          # IMPORTANT:
          #
          # We use:
          #
          #   x-vercel-protection-bypass
          #
          # We do NOT use:
          #
          #   x-vercel-set-bypass-cookie
          #
          # here.
          # ----------------------------------------------------

          echo "Requesting the protected TrustPay Preview..."
          echo

          CURL_RESULT="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 10 \
              --proto '=https' \
              --proto-redir '=https' \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              --header "User-Agent: TrustPay-R1-Preview-Smoke/1.0" \
              --dump-header "${HEADER_FILE}" \
              --output "${BODY_FILE}" \
              --write-out '%{http_code}\n%{url_effective}' \
              "${PREVIEW_URL}/"
          )"

          # ----------------------------------------------------
          # Extract final HTTP status and final URL.
          # ----------------------------------------------------

          HTTP_STATUS="$(printf '%s\n' "${CURL_RESULT}" | sed -n '1p')"

          FINAL_URL="$(printf '%s\n' "${CURL_RESULT}" | sed -n '2p')"

          echo "HTTP_STATUS=${HTTP_STATUS}"
          echo "FINAL_URL=${FINAL_URL}"
          echo

          # ----------------------------------------------------
          # Reject Vercel authentication.
          # ----------------------------------------------------

          if [[ "${FINAL_URL}" == *"vercel.com/login"* ]]; then
            echo "::error::The Preview redirected to the Vercel login page."
            echo "::error::Vercel Protection Bypass was not accepted."
            exit 1
          fi

          # ----------------------------------------------------
          # Require a successful final HTTP response.
          # ----------------------------------------------------

          if [[ ! "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::The final Preview response was not successful."
            echo "::error::Final HTTP status: ${HTTP_STATUS}"
            echo
            echo "Response headers:"
            sed -n '1,100p' "${HEADER_FILE}" || true
            echo
            echo "Response preview:"
            sed -n '1,160p' "${BODY_FILE}" || true
            exit 1
          fi

          # ----------------------------------------------------
          # Make sure the response is really TrustPay.
          # ----------------------------------------------------

          if ! grep -qi "TrustPay" "${BODY_FILE}"; then
            echo "::error::The Preview responded, but the returned page does not contain recognizable TrustPay content."
            echo
            echo "Final URL:"
            echo "${FINAL_URL}"
            echo
            echo "Response preview:"
            sed -n '1,160p' "${BODY_FILE}" || true
            exit 1
          fi

          # ----------------------------------------------------
          # Everything passed.
          # ----------------------------------------------------

          echo
          echo "=============================================="
          echo "VERCEL PREVIEW SMOKE: PASS"
          echo "=============================================="
          echo
          echo "The protected TrustPay Preview was reached."
          echo "The final response was successful."
          echo "The final URL was not the Vercel login page."
          echo "TrustPay content was found in the response."
          echo

      # ========================================================
      # 24. UPLOAD EVIDENCE
      # ========================================================

      - name: Upload R1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: trustpay-r1-evidence-${{ github.run_id }}
          path: .r1-evidence/

      # ========================================================
      # 25. CREATE R1 CERTIFICATION TAG
      #
      # Certification occurs only if:
      #
      # 1. Every prior step passed.
      # 2. Real remote migration application was requested.
      #
      # The tag points to the exact checked-out R1 commit.
      # ========================================================

      - name: Create R1 certification tag
        if: ${{ success() && inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-r1"

          R1_SHA="$(git rev-parse HEAD)"

          echo "Preparing R1 certification."

          echo "Tag:"
          echo "${TAG}"

          echo "R1 commit:"
          echo "${R1_SHA}"

          # ------------------------------------------------------
          # Never overwrite an existing release tag.
          # ------------------------------------------------------

          if git ls-remote \
            --exit-code \
            --refs \
            origin \
            "refs/tags/${TAG}" \
            >/dev/null 2>&1; then

            echo "::error::Tag ${TAG} already exists."

            echo "::error::Existing release tags are never overwritten."

            exit 1

          fi

          # ------------------------------------------------------
          # Configure bot identity.
          # ------------------------------------------------------

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # ------------------------------------------------------
          # Create annotated tag.
          # ------------------------------------------------------

          git tag \
            -a "${TAG}" \
            "${R1_SHA}" \
            -m "TrustPay R1 certification ${TAG}"

          # ------------------------------------------------------
          # Push only the new tag.
          # ------------------------------------------------------

          git push \
            origin \
            "refs/tags/${TAG}"

          echo
          echo "=============================================="
          echo "TRUSTPAY R1 CERTIFICATION TAG CREATED"
          echo "=============================================="
          echo "Tag: ${TAG}"
          echo "Commit: ${R1_SHA}"
          echo "=============================================="
