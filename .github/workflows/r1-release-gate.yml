name: TrustPay R1 Release Gate

on:
  workflow_dispatch:
    inputs:

      preview_url:
        description: "Exact Vercel Preview URL for the current R1 deployment"
        required: true
        type: string

      apply_remote_migrations:
        description: "Apply/reconcile R1 Supabase migrations"
        required: true
        type: boolean
        default: false

      confirm_target:
        description: "Type TRUSTPAY-R1-SUPABASE-APPLY only when intentionally applying/reconciling R1 migrations"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: trustpay-r1-release-gate
  cancel-in-progress: true

jobs:

  release-gate:

    name: TrustPay R1 Complete Gate

    runs-on: ubuntu-latest

    env:

      # ======================================================
      # TRUSTPAY RELEASE TARGET
      # ======================================================

      R1_BRANCH: v2.0.0-execution-r1

      # TrustPay application runtime.
      # This remains Node 22.
      NODE_VERSION: "22"

      # ======================================================
      # SUPABASE
      #
      # These are JOB-LEVEL variables so every Supabase CLI
      # step receives the required credentials.
      # ======================================================

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # ======================================================
      # VERCEL
      # ======================================================

      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # ======================================================
      # KNOWN R1 BASELINE MIGRATION
      # ======================================================

      R1_BASELINE_MIGRATION: "20260918000000"

      # ======================================================
      # KNOWN R1 STORAGE BOOTSTRAP POLICY
      #
      # The initial migration intentionally creates the private
      # document bucket using idempotent metadata SQL:
      #
      # INSERT ... ON CONFLICT (id) DO NOTHING
      #
      # This is allowed ONLY for storage.buckets metadata.
      #
      # Ordinary application-data INSERT/UPDATE/DELETE/COPY/MERGE
      # statements remain blocked from automatic migration-history
      # repair.
      # ======================================================

      R1_STORAGE_BUCKET_NAMESPACE: "storage.buckets"

    steps:

      # ======================================================
      # 1. CHECK OUT R1
      #
      # The workflow may be started manually from main.
      #
      # The code actually tested MUST be the R1 execution branch.
      # ======================================================

      - name: Checkout R1 branch
        uses: actions/checkout@v5
        with:
          ref: v2.0.0-execution-r1
          fetch-depth: 0
          persist-credentials: true

      # ======================================================
      # 2. INITIALIZE EVIDENCE DIRECTORY
      #
      # This happens immediately so that the evidence upload
      # step always has something to upload even when a later
      # validation step fails.
      # ======================================================

      - name: Initialize R1 evidence directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          echo "R1 evidence directory initialized."
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Workflow run: ${GITHUB_RUN_ID}"
          echo "Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # ======================================================
      # 3. VERIFY R1 BRANCH AND EXACT COMMIT
      #
      # We compare the checked-out HEAD with the current remote
      # tip of the R1 execution branch.
      #
      # This prevents the gate from accidentally testing another
      # branch/ref while believing it is testing R1.
      # ======================================================

      - name: Verify R1 branch and commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected R1 branch:"
          echo "${R1_BRANCH}"

          echo

          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "Actual checked-out commit:"
          echo "${ACTUAL_SHA}"

          echo

          echo "Fetching remote R1 branch..."
          git fetch origin "${R1_BRANCH}" --prune --no-tags

          EXPECTED_SHA="$(git rev-parse "origin/${R1_BRANCH}")"

          echo "Expected remote R1 branch commit:"
          echo "${EXPECTED_SHA}"

          echo

          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::The checked-out commit does not match the current R1 execution branch tip."
            echo "::error::Expected: ${EXPECTED_SHA}"
            echo "::error::Actual:   ${ACTUAL_SHA}"
            exit 1
          fi

          echo "R1 branch/commit identity: PASS"

          echo

          echo "Validated R1 commit:"
          echo "${ACTUAL_SHA}"

          echo

          echo "Recent commits:"
          git log -5 --oneline

          echo

          test -f package.json || {
            echo "::error::package.json was not found."
            exit 1
          }

          {
            echo "R1_BRANCH=${R1_BRANCH}"
            echo "R1_SHA=${ACTUAL_SHA}"
          } > .r1-evidence/r1-commit.txt

          echo "R1 branch and commit preflight: PASS"

      # ======================================================
      # 4. NODE
      #
      # The TrustPay application remains on Node 22.
      #
      # actions/setup-node@v7 uses the current GitHub Actions
      # runtime and avoids the previous Node 20 deprecation
      # warning.
      # ======================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm

      # ======================================================
      # 5. INSTALL
      # ======================================================

      - name: Install dependencies from lockfile
        run: npm ci

      # ======================================================
      # 6. SECURITY
      # ======================================================

      - name: Security audit
        run: npm audit --audit-level=high

      # ======================================================
      # 7. TYPECHECK
      # ======================================================

      - name: Core typecheck
        run: npm run typecheck:core --if-present

      - name: Static typecheck
        run: npm run typecheck:static --if-present

      - name: Application typecheck
        run: npm run typecheck --if-present

      # ======================================================
      # 8. LINT
      # ======================================================

      - name: Lint
        run: npm run lint --if-present

      # ======================================================
      # 9. TESTS
      # ======================================================

      - name: Unit and integration tests
        run: npm run test --if-present

      - name: Core smoke
        run: npm run test:core --if-present

      - name: V2 deterministic smoke
        run: node scripts/v2-smoke.cjs

      # ======================================================
      # 10. PRODUCTION BUILD
      # ======================================================

      - name: Production build
        run: npm run build

      # ======================================================
      # 11. PLAYWRIGHT
      # ======================================================

      - name: Install Playwright Chromium
        if: hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        if: hashFiles('playwright.config.*') != ''
        run: npm run e2e --if-present

      # ======================================================
      # 12. SUPABASE CLI
      #
      # Keep the known-good Supabase CLI installation mechanism.
      # ======================================================

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.117.0"

      # ======================================================
      # 13. VERIFY SUPABASE CREDENTIALS
      # ======================================================

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase credentials..."

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_[^[:space:]]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN does not look like a Supabase personal access token."
            echo "::error::It must begin with sbp_."
            exit 1
          fi

          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is missing."
            exit 1
          fi

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."
            exit 1
          fi

          echo "Supabase credential preflight: PASS"

      # ======================================================
      # 14. SHOW SUPABASE CLI VERSION
      # ======================================================

      - name: Verify Supabase CLI
        run: |
          set -euo pipefail

          supabase --version

      # ======================================================
      # 15. VERIFY RUNNER DOCKER
      #
      # This is Docker supplied by GitHub's hosted runner.
      # You do NOT need Docker on your own computer.
      # ======================================================

      - name: Verify GitHub runner Docker
        shell: bash
        run: |
          set -euo pipefail

          docker version

      # ======================================================
      # 16. LINK TRUSTPAY SUPABASE PROJECT
      # ======================================================

      - name: Link TrustPay Supabase project
        shell: bash
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --password "${SUPABASE_DB_PASSWORD}"

          echo "Supabase project link: PASS"

      # ======================================================
      # 17. RECORD MIGRATION STATE BEFORE ANY CHANGE
      # ======================================================

      - name: Show Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-before.txt

      # ======================================================
      # 18. CHECK PENDING MIGRATIONS
      #
      # READ ONLY.
      # ======================================================

      - name: Check pending migrations
        shell: bash
        run: |
          set -euo pipefail

          supabase db push \
            --linked \
            --dry-run \
            | tee .r1-evidence/migration-dry-run.txt

      # ======================================================
      # 19. VALIDATE REMOTE-CHANGE AUTHORIZATION
      #
      # Remote reconciliation/application is deliberately
      # fail-closed.
      # ======================================================

      - name: Validate migration change authorization
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then
            echo "::error::Remote migration application/reconciliation was requested, but confirm_target is incorrect."
            echo "::error::Type exactly: TRUSTPAY-R1-SUPABASE-APPLY"
            exit 1
          fi

          echo "Remote migration authorization: PASS"

      # ======================================================
      # 20. LOCATE BASELINE MIGRATION
      # ======================================================

      - name: Locate R1 baseline migration
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_FILE=""

          while IFS= read -r file; do
            MIGRATION_FILE="${file}"
            break
          done < <(
            find supabase/migrations \
              -maxdepth 1 \
              -type f \
              -name "${R1_BASELINE_MIGRATION}_*.sql" \
              -print
          )

          if [[ -z "${MIGRATION_FILE}" ]]; then
            echo "::error::Could not find migration ${R1_BASELINE_MIGRATION} in supabase/migrations."
            exit 1
          fi

          echo "Baseline migration file:"
          echo "${MIGRATION_FILE}"

          echo "R1_BASELINE_FILE=${MIGRATION_FILE}" \
            > .r1-evidence/baseline-migration.txt

      # ======================================================
      # 21. ANALYZE BASELINE SQL SAFELY
      #
      # IMPORTANT:
      #
      # The previous workflow rejected ALL INSERT statements.
      #
      # That was too broad.
      #
      # This version allows ONLY this class of bootstrap DML:
      #
      #   INSERT INTO storage.buckets (...)
      #   VALUES (...)
      #   ON CONFLICT (...) DO NOTHING;
      #
      # This is suitable for idempotent Storage bucket metadata.
      #
      # It still BLOCKS arbitrary application-data:
      #
      #   INSERT
      #   UPDATE
      #   DELETE
      #   MERGE
      #   COPY
      #
      # unless the statement is the explicitly allowed
      # storage.buckets bootstrap form.
      #
      # The parser is intentionally conservative:
      #
      # - comments are removed
      # - dollar-quoted DO blocks are blocked
      # - unsupported DML causes failure
      # - only simple single-statement storage bucket inserts
      #   using literal values are allowed
      # ======================================================

      - name: Analyze R1 baseline SQL
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_FILE="$(cut -d= -f2- .r1-evidence/baseline-migration.txt)"

          python3 - "${MIGRATION_FILE}" <<'PY'
          import re
          import sys
          from pathlib import Path

          migration_path = Path(sys.argv[1])
          sql = migration_path.read_text(encoding="utf-8")

          # --------------------------------------------------
          # Remove SQL comments while preserving line structure.
          # --------------------------------------------------

          sql = re.sub(r"/\*.*?\*/", "", sql, flags=re.S)
          sql = re.sub(r"--[^\n]*", "", sql)

          # --------------------------------------------------
          # DO blocks are intentionally unsupported for automatic
          # migration-history reconciliation.
          # --------------------------------------------------

          if re.search(r"\bDO\s+\$\$", sql, flags=re.I):
              print("::error::The baseline migration contains a DO block.")
              print("::error::Automatic migration-history repair is disabled for DO-block migrations.")
              sys.exit(1)

          # --------------------------------------------------
          # Split statements conservatively.
          #
          # The baseline migration is expected to contain normal
          # migration SQL. This does not attempt to become a full
          # PostgreSQL parser.
          # --------------------------------------------------

          statements = [
              stmt.strip()
              for stmt in re.split(r";\s*", sql)
              if stmt.strip()
          ]

          allowed_storage_statements = []
          forbidden_dml = []

          storage_pattern = re.compile(
              r"""
              ^\s*
              INSERT\s+INTO\s+
              (?:"?storage"?\.)?
              "?buckets"?
              \s*
              \(
                  \s*"?(id)"?\s*,
                  \s*"?(name)"?\s*,
                  \s*"?(public)"?\s*
              \)
              \s*
              VALUES
              \s*
              \(
                  \s*'((?:''|[^'])*)'\s*,
                  \s*'((?:''|[^'])*)'\s*,
                  \s*(TRUE|FALSE)\s*
              \)
              \s*
              ON\s+CONFLICT
              (?:\s*\([^)]*\))?
              \s+
              DO\s+NOTHING
              \s*$
              """,
              flags=re.I | re.X,
          )

          dml_pattern = re.compile(
              r"^\s*(INSERT|UPDATE|DELETE|MERGE|COPY)\b",
              flags=re.I,
          )

          for statement in statements:
              match = storage_pattern.match(statement)

              if match:
                  bucket_id = match.group(3).replace("''", "'")
                  bucket_name = match.group(4).replace("''", "'")
                  bucket_public = match.group(5).upper()

                  allowed_storage_statements.append(
                      {
                          "id": bucket_id,
                          "name": bucket_name,
                          "public": bucket_public,
                          "sql": statement,
                      }
                  )
                  continue

              dml = dml_pattern.match(statement)

              if dml:
                  forbidden_dml.append(statement)

          evidence_path = Path(".r1-evidence")

          allowed_path = evidence_path / "allowed-storage-bootstrap.sql"
          forbidden_path = evidence_path / "forbidden-dml.sql"

          with allowed_path.open("w", encoding="utf-8") as handle:
              for item in allowed_storage_statements:
                  handle.write(item["sql"])
                  handle.write(";\n\n")

          with forbidden_path.open("w", encoding="utf-8") as handle:
              for statement in forbidden_dml:
                  handle.write(statement)
                  handle.write(";\n\n")

          print("Baseline SQL analysis complete.")
          print(f"Allowed storage bootstrap statements: {len(allowed_storage_statements)}")
          print(f"Forbidden DML statements: {len(forbidden_dml)}")

          if forbidden_dml:
              print()
              print("The following DML statements are NOT eligible for automatic migration-history repair:")
              for index, statement in enumerate(forbidden_dml, start=1):
                  print()
                  print(f"--- forbidden DML #{index} ---")
                  print(statement)
              sys.exit(1)

          with (evidence_path / "storage-buckets.expected").open(
              "w",
              encoding="utf-8",
          ) as handle:
              for item in allowed_storage_statements:
                  handle.write(
                      f"{item['id']}\t{item['name']}\t{item['public']}\n"
                  )

          print("Baseline DML safety policy: PASS")
          PY

      # ======================================================
      # 22. VERIFY EXPECTED STORAGE BUCKETS REMOTELY
      #
      # Supabase db diff is not treated as authoritative for
      # Storage bucket state.
      #
      # The expected bucket rows are queried directly from the
      # linked database.
      #
      # We require the exact id, name, and public setting from
      # the migration to already exist remotely BEFORE repairing
      # migration history.
      #
      # This closes the important safety gap:
      #
      # "schema exists" is NOT enough when migration SQL also
      # provisions data-backed Storage metadata.
      # ======================================================

      - name: Verify R1 Storage bucket state
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_FILE=".r1-evidence/storage-buckets.expected"
          RESULTS_FILE=".r1-evidence/storage-buckets.remote.txt"

          : > "${RESULTS_FILE}"

          if [[ ! -s "${EXPECTED_FILE}" ]]; then
            echo "No allowed storage bucket bootstrap statements were found."
            echo "No Storage bucket verification is required."
            exit 0
          fi

          while IFS=$'\t' read -r BUCKET_ID BUCKET_NAME BUCKET_PUBLIC; do

            [[ -n "${BUCKET_ID}" ]] || continue

            if [[ "${BUCKET_PUBLIC}" == "TRUE" ]]; then
              EXPECTED_PUBLIC="true"
            else
              EXPECTED_PUBLIC="false"
            fi

            # Escape PostgreSQL string literals defensively.
            ESCAPED_ID="${BUCKET_ID//\'/\'\'}"
            ESCAPED_NAME="${BUCKET_NAME//\'/\'\'}"

            SQL="
              SELECT
                CASE
                  WHEN EXISTS (
                    SELECT 1
                    FROM storage.buckets
                    WHERE id = '${ESCAPED_ID}'
                      AND name = '${ESCAPED_NAME}'
                      AND public = ${EXPECTED_PUBLIC}
                  )
                  THEN 'PRESENT'
                  ELSE 'MISSING'
                END AS status;
            "

            echo "Checking Storage bucket:"
            echo "  id=${BUCKET_ID}"
            echo "  name=${BUCKET_NAME}"
            echo "  public=${EXPECTED_PUBLIC}"

            QUERY_RESULT="$(
              supabase db query \
                --linked \
                -p "${SUPABASE_DB_PASSWORD}" \
                "${SQL}"
            )"

            printf '%s\n' "${QUERY_RESULT}" \
              | tee -a "${RESULTS_FILE}"

            if ! printf '%s\n' "${QUERY_RESULT}" \
              | grep -Eiq '(^|[^[:alpha:]])PRESENT([^[:alpha:]]|$)'; then

              echo "::error::Required Storage bucket is missing or does not match the migration."
              echo "::error::Bucket id: ${BUCKET_ID}"
              echo "::error::Bucket name: ${BUCKET_NAME}"
              echo "::error::Expected public: ${EXPECTED_PUBLIC}"
              exit 1
            fi

            echo "Storage bucket verification: PASS"
            echo

          done < "${EXPECTED_FILE}"

          echo "All required R1 Storage bucket metadata is present remotely."

      # ======================================================
      # 23. VERIFY PUBLIC/EXTENSIONS SCHEMA EQUIVALENCE
      #
      # IMPORTANT:
      #
      # Current Supabase documentation notes that db diff can
      # fail to fully capture Storage bucket changes.
      #
      # Therefore Storage is verified separately above.
      #
      # The schema comparison here focuses on:
      #
      #   public
      #   extensions
      #
      # where the application's R1 database objects live.
      #
      # If there is ANY schema difference, stop.
      # ======================================================

      - name: Verify R1 application schema equivalence
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          DIFF_FILE=".r1-evidence/r1-application-schema-diff.sql"

          rm -f "${DIFF_FILE}"

          echo "Comparing repository migrations against the linked remote database."
          echo "Schemas checked: public, extensions"
          echo

          supabase db diff \
            --linked \
            --use-pg-delta \
            --schema public,extensions \
            --output "${DIFF_FILE}"

          touch "${DIFF_FILE}"

          if [[ -s "${DIFF_FILE}" ]]; then

            echo "::error::The repository migration schema does NOT exactly match the remote database."
            echo "::error::Migration history will NOT be repaired automatically."
            echo
            echo "Schema differences found:"
            echo
            cat "${DIFF_FILE}"

            exit 1
          fi

          echo "Application schema comparison: PASS"
          echo "No public/extension schema differences were detected."

      # ======================================================
      # 24. RECORD RECONCILIATION DECISION
      # ======================================================

      - name: Record R1 reconciliation decision
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "R1 MIGRATION RECONCILIATION DECISION"
            echo "BASELINE_MIGRATION=${R1_BASELINE_MIGRATION}"
            echo "APPLICATION_SCHEMA_CHECK=PASS"
            echo "STORAGE_BUCKET_CHECK=PASS"
            echo "DANGEROUS_DML_CHECK=PASS"
            echo "POLICY=SCHEMA-EQUIVALENCE-PLUS-STORAGE-METADATA-EQUIVALENCE"
            echo "ACTION=SAFE-MIGRATION-HISTORY-REPAIR"
          } > .r1-evidence/reconciliation-decision.txt

          echo "R1 migration reconciliation preflight: PASS"

      # ======================================================
      # 25. REPAIR BASELINE MIGRATION HISTORY
      #
      # IMPORTANT:
      #
      # This DOES NOT execute the migration SQL.
      #
      # Supabase documents migration repair as a history-table
      # operation: it marks a migration applied/reverted without
      # executing the migration SQL.
      #
      # We only reach this step after:
      #
      #   - explicit authorization
      #   - exact baseline file found
      #   - unsafe DML rejected
      #   - required Storage metadata verified
      #   - application schema equivalence verified
      # ======================================================

      - name: Repair baseline migration history
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repairing remote migration history..."
          echo "Migration: ${R1_BASELINE_MIGRATION}"

          supabase migration repair \
            "${R1_BASELINE_MIGRATION}" \
            --status applied \
            --linked

          echo "Baseline migration history repair: PASS"

      # ======================================================
      # 26. VERIFY MIGRATION HISTORY AFTER REPAIR
      # ======================================================

      - name: Verify migration history after reconciliation
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-after-repair.txt

      # ======================================================
      # 27. APPLY REMAINING MIGRATIONS
      #
      # --yes prevents interactive confirmation prompts in CI.
      # ======================================================

      - name: Apply remaining Supabase migrations
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying remaining TrustPay migrations..."

          supabase \
            --yes \
            db push \
            --linked

          echo "Remaining Supabase migration apply: PASS"

      # ======================================================
      # 28. VERIFY FINAL MIGRATION STATE
      #
      # This runs whether remote migration application was
      # requested or not, so the final evidence always records
      # the actual remote state.
      # ======================================================

      - name: Confirm final Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-final.txt

      # ======================================================
      # 29. LINKED REMOTE DATABASE LINT
      #
      # --linked is mandatory here so the CLI does not attempt
      # the local 127.0.0.1:54322 database.
      # ======================================================

      - name: Lint linked TrustPay Supabase database
        shell: bash
        run: |
          set -euo pipefail

          echo "Linting the linked remote TrustPay database..."

          supabase db lint \
            --linked \
            --fail-on error

          echo "Linked remote database lint: PASS"

      # ======================================================
      # 30. PROTECTED VERCEL PREVIEW SMOKE
      #
      # IMPORTANT:
      #
      # Use ONLY:
      #
      #   x-vercel-protection-bypass
      #
      # Do NOT use:
      #
      #   x-vercel-set-bypass-cookie
      #
      # because the latter caused the previous unwanted 307
      # behavior.
      # ======================================================

      - name: Protected Vercel Preview smoke
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PREVIEW_URL:-}" ]]; then
            echo "::error::No Vercel Preview URL was supplied."
            exit 1
          fi

          PREVIEW_URL="${PREVIEW_URL%/}"

          if [[ "${PREVIEW_URL}" != https://* ]]; then
            echo "::error::Preview URL must begin with https://"
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          HEADER_FILE="$(mktemp)"

          cleanup() {
            rm -f "${BODY_FILE}" "${HEADER_FILE}"
          }

          trap cleanup EXIT

          CURL_RESULT="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 10 \
              --proto '=https' \
              --proto-redir '=https' \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              --header "User-Agent: TrustPay-R1-Preview-Smoke/1.0" \
              --dump-header "${HEADER_FILE}" \
              --output "${BODY_FILE}" \
              --write-out '%{http_code}\n%{url_effective}' \
              "${PREVIEW_URL}/"
          )"

          HTTP_STATUS="$(printf '%s\n' "${CURL_RESULT}" | sed -n '1p')"

          FINAL_URL="$(printf '%s\n' "${CURL_RESULT}" | sed -n '2p')"

          echo "HTTP_STATUS=${HTTP_STATUS}"
          echo "FINAL_URL=${FINAL_URL}"

          if [[ "${FINAL_URL}" == *"vercel.com/login"* ]]; then
            echo "::error::Preview redirected to Vercel authentication."
            exit 1
          fi

          if [[ ! "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Preview did not return a successful final HTTP status."
            echo "::error::HTTP status: ${HTTP_STATUS}"
            exit 1
          fi

          if ! grep -qi "TrustPay" "${BODY_FILE}"; then
            echo "::error::Preview returned a page that does not contain recognizable TrustPay content."
            exit 1
          fi

          echo "Vercel Preview smoke: PASS"

          {
            echo "PREVIEW_URL=${PREVIEW_URL}"
            echo "HTTP_STATUS=${HTTP_STATUS}"
            echo "FINAL_URL=${FINAL_URL}"
            echo "RESULT=PASS"
          } > .r1-evidence/vercel-preview-smoke.txt

      # ======================================================
      # 31. VERIFY REQUIRED R1 ARTIFACTS
      #
      # Fail if important evidence files expected for an R1
      # certification are missing.
      # ======================================================

      - name: Verify R1 evidence completeness
        shell: bash
        run: |
          set -euo pipefail

          test -s .r1-evidence/r1-commit.txt || {
            echo "::error::Missing R1 commit evidence."
            exit 1
          }

          test -s .r1-evidence/migration-state-before.txt || {
            echo "::error::Missing migration-before evidence."
            exit 1
          }

          test -s .r1-evidence/migration-dry-run.txt || {
            echo "::error::Missing migration dry-run evidence."
            exit 1
          }

          test -s .r1-evidence/migration-state-final.txt || {
            echo "::error::Missing final migration-state evidence."
            exit 1
          }

          test -s .r1-evidence/vercel-preview-smoke.txt || {
            echo "::error::Missing Vercel Preview smoke evidence."
            exit 1
          }

          echo "R1 evidence completeness: PASS"

      # ======================================================
      # 32. RECORD RELEASE EVIDENCE CONTEXT
      # ======================================================

      - name: Record R1 release evidence
        shell: bash
        run: |
          set -euo pipefail

          R1_SHA="$(git rev-parse HEAD)"

          {
            echo "TRUSTPAY R1 RELEASE EVIDENCE"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "REPOSITORY=${GITHUB_REPOSITORY}"
            echo "R1_BRANCH=${R1_BRANCH}"
            echo "R1_SHA=${R1_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "TRIGGER_SHA=${GITHUB_SHA}"
            echo "TRIGGER_REF=${GITHUB_REF}"
            echo "PREVIEW_URL=${{ inputs.preview_url }}"
            echo "REMOTE_MIGRATIONS_APPLIED=${{ inputs.apply_remote_migrations }}"
            echo "CONFIRMATION_TARGET=${{ inputs.confirm_target }}"
            echo "KNOWN_BASELINE_MIGRATION=${R1_BASELINE_MIGRATION}"
            echo "BASELINE_RECONCILIATION_POLICY=SCHEMA-EQUIVALENCE-PLUS-STORAGE-METADATA-EQUIVALENCE"
            echo "CERTIFICATION_TAG=v2.0.0-r1"
            echo "CERTIFICATION_TAG_POLICY=NEVER-RETARGET"
          } > .r1-evidence/release-context.txt

          echo "R1 release evidence context written."

      # ======================================================
      # 33. ENFORCE R1 CERTIFICATION PRECONDITIONS
      #
      # The gate must NOT certify R1 unless the remote migration
      # reconciliation path was intentionally executed.
      # ======================================================

      - name: Enforce R1 certification preconditions
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.apply_remote_migrations }}" != "true" ]]; then
            echo "::error::R1 certification requires apply_remote_migrations=true."
            exit 1
          fi

          if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then
            echo "::error::R1 certification requires confirm_target=TRUSTPAY-R1-SUPABASE-APPLY."
            exit 1
          fi

          echo "R1 certification preconditions: PASS"

      # ======================================================
      # 34. CREATE OR VERIFY R1 CERTIFICATION TAG
      #
      # IMPORTANT:
      #
      # The tag target is the ACTUAL checked-out HEAD.
      #
      # It is NOT github.sha, because the workflow may have
      # been manually launched from main while intentionally
      # checking out the R1 execution branch.
      #
      # Behavior:
      #
      # - tag absent:
      #     create it at validated HEAD
      #
      # - tag already at validated HEAD:
      #     succeed and leave it untouched
      #
      # - tag at another commit:
      #     fail
      #
      # NEVER retarget an existing certification tag.
      # ======================================================

      - name: Create or verify R1 certification tag
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-r1"
          R1_SHA="$(git rev-parse HEAD)"

          echo "R1 certification target:"
          echo "  Branch: ${R1_BRANCH}"
          echo "  Commit: ${R1_SHA}"
          echo "  Tag:    ${TAG}"

          echo

          if git ls-remote \
            --exit-code \
            --refs \
            origin \
            "refs/tags/${TAG}" \
            >/dev/null 2>&1; then

            echo "${TAG} already exists."

            git fetch \
              origin \
              "refs/tags/${TAG}:refs/tags/${TAG}"

            EXISTING_SHA="$(git rev-list -n 1 "${TAG}^{commit}")"

            echo "Existing tag commit:"
            echo "${EXISTING_SHA}"

            echo

            echo "Validated R1 commit:"
            echo "${R1_SHA}"

            if [[ "${EXISTING_SHA}" != "${R1_SHA}" ]]; then
              echo "::error::Certification tag ${TAG} exists at a different commit."
              echo "::error::Existing tag commit: ${EXISTING_SHA}"
              echo "::error::Validated R1 commit: ${R1_SHA}"
              echo "::error::The certification tag will NOT be retargeted."
              exit 1
            fi

            {
              echo "TAG=${TAG}"
              echo "TAG_SHA=${EXISTING_SHA}"
              echo "TAG_RESULT=VERIFIED"
            } > .r1-evidence/certification-tag.txt

            echo
            echo "=============================================="
            echo "TRUSTPAY R1 CERTIFICATION TAG VERIFIED"
            echo "=============================================="
            echo "Tag:    ${TAG}"
            echo "Commit: ${R1_SHA}"
            echo "Result: Existing tag already points to exact validated R1 commit."
            echo "=============================================="

            exit 0
          fi

          echo "${TAG} does not exist."

          echo
          echo "Creating immutable annotated certification tag..."

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            -a \
            "${TAG}" \
            "${R1_SHA}" \
            -m "TrustPay R1 certification ${TAG}"

          echo
          echo "Pushing certification tag..."

          if git push \
            origin \
            "refs/tags/${TAG}"; then

            {
              echo "TAG=${TAG}"
              echo "TAG_SHA=${R1_SHA}"
              echo "TAG_RESULT=CREATED"
            } > .r1-evidence/certification-tag.txt

            echo
            echo "=============================================="
            echo "TRUSTPAY R1 CERTIFICATION TAG CREATED"
            echo "=============================================="
            echo "Tag:    ${TAG}"
            echo "Commit: ${R1_SHA}"
            echo "=============================================="

            exit 0
          fi

          # --------------------------------------------------
          # Race-safe recheck.
          #
          # If another process created the tag immediately after
          # our initial check, never overwrite it.
          # --------------------------------------------------

          echo
          echo "::warning::Tag push did not succeed. Re-checking the remote tag."

          git tag -d "${TAG}" >/dev/null 2>&1 || true

          git fetch \
            origin \
            "refs/tags/${TAG}:refs/tags/${TAG}" \
            || {
              echo "::error::Unable to confirm the certification tag after the failed push."
              exit 1
            }

          EXISTING_SHA="$(git rev-list -n 1 "${TAG}^{commit}")"

          echo "Existing tag commit after recheck:"
          echo "${EXISTING_SHA}"

          echo
          echo "Validated R1 commit:"
          echo "${R1_SHA}"

          if [[ "${EXISTING_SHA}" != "${R1_SHA}" ]]; then
            echo "::error::The certification tag exists at a different commit."
            echo "::error::Existing tag commit: ${EXISTING_SHA}"
            echo "::error::Validated R1 commit: ${R1_SHA}"
            echo "::error::The certification tag will NOT be retargeted."
            exit 1
          fi

          {
            echo "TAG=${TAG}"
            echo "TAG_SHA=${EXISTING_SHA}"
            echo "TAG_RESULT=VERIFIED_AFTER_RACE"
          } > .r1-evidence/certification-tag.txt

          echo
          echo "=============================================="
          echo "TRUSTPAY R1 CERTIFICATION TAG VERIFIED"
          echo "=============================================="
          echo "Tag:    ${TAG}"
          echo "Commit: ${R1_SHA}"
          echo "Result: Concurrent creation resolved safely."
          echo "=============================================="

      # ======================================================
      # 35. FINAL RELEASE-CERTIFICATION ASSERTION
      #
      # This step runs only if the tag step succeeded.
      #
      # It confirms that:
      #
      #   v2.0.0-r1
      #
      # resolves to the exact commit that was actually tested.
      # ======================================================

      - name: Final R1 certification assertion
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-r1"
          R1_SHA="$(git rev-parse HEAD)"

          git fetch \
            origin \
            "refs/tags/${TAG}:refs/tags/${TAG}"

          TAG_SHA="$(git rev-list -n 1 "${TAG}^{commit}")"

          echo "Validated R1 commit:"
          echo "${R1_SHA}"

          echo

          echo "Certification tag commit:"
          echo "${TAG_SHA}"

          if [[ "${TAG_SHA}" != "${R1_SHA}" ]]; then
            echo "::error::Final certification assertion failed."
            echo "::error::Tag ${TAG} does not point to validated R1 commit."
            exit 1
          fi

          {
            echo "FINAL_R1_ASSERTION=PASS"
            echo "R1_SHA=${R1_SHA}"
            echo "TAG=${TAG}"
            echo "TAG_SHA=${TAG_SHA}"
          } > .r1-evidence/final-certification.txt

          echo
          echo "=============================================="
          echo "TRUSTPAY R1 CERTIFICATION ASSERTION: PASS"
          echo "=============================================="
          echo "R1 commit: ${R1_SHA}"
          echo "Tag:       ${TAG}"
          echo "Tag SHA:   ${TAG_SHA}"
          echo "=============================================="

      # ======================================================
      # 36. UPLOAD R1 EVIDENCE
      #
      # IMPORTANT:
      #
      # .r1-evidence is a hidden directory.
      #
      # include-hidden-files=true makes sure the artifact
      # uploader actually includes it.
      #
      # always() ensures failure diagnostics are uploaded even
      # when a later gate step fails.
      # ======================================================

      - name: Upload R1 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: trustpay-r1-evidence-${{ github.run_id }}
          path: .r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
