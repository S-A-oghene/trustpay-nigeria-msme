name: TrustPay R1 Release Gate

on:
  workflow_dispatch:
    inputs:

      preview_url:
        description: "Exact Vercel Preview URL for the current R1 deployment"
        required: true
        type: string

      apply_remote_migrations:
        description: "Apply/reconcile R1 Supabase migrations"
        required: true
        type: boolean
        default: false

      confirm_target:
        description: "Type TRUSTPAY-R1-SUPABASE-APPLY only when intentionally applying/reconciling R1 migrations"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: trustpay-r1-release-gate
  cancel-in-progress: true

jobs:

  release-gate:

    name: TrustPay R1 Complete Gate

    runs-on: ubuntu-latest

    env:

      # ======================================================
      # TRUSTPAY RELEASE TARGET
      # ======================================================

      R1_BRANCH: v2.0.0-execution-r1

      # Keep the application's tested Node.js version at 22.
      # The GitHub Actions wrappers themselves use current
      # Node 24-compatible action releases below.
      NODE_VERSION: "22"

      # ======================================================
      # SUPABASE
      #
      # These are JOB-LEVEL variables.
      #
      # Every Supabase CLI step therefore receives the
      # credentials without relying on step-local scope.
      # ======================================================

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # ======================================================
      # VERCEL
      # ======================================================

      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # ======================================================
      # KNOWN BASELINE MIGRATION
      # ======================================================

      R1_BASELINE_MIGRATION: "20260918000000"

    steps:

      # ======================================================
      # 1. CHECK OUT R1
      #
      # Important:
      #
      # The workflow may be manually started from main, but
      # the code actually tested MUST be the R1 execution
      # branch.
      #
      # fetch-depth: 0 gives us complete history, branches,
      # and tags so that the final certification-tag check
      # can resolve exact commit identities safely.
      # ======================================================

      - name: Checkout R1 branch
        uses: actions/checkout@v5
        with:
          ref: v2.0.0-execution-r1
          fetch-depth: 0
          persist-credentials: true

      # ======================================================
      # 2. VERIFY R1 BRANCH AND EXACT COMMIT
      #
      # This prevents a future accidental run from testing
      # some other branch/ref while believing it is testing R1.
      # ======================================================

      - name: Verify R1 branch and commit
        id: r1_commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected R1 branch:"
          echo "${R1_BRANCH}"

          echo

          echo "Actual checked-out commit:"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "${ACTUAL_SHA}"

          echo

          echo "Expected remote R1 branch commit:"
          git fetch origin "${R1_BRANCH}" --prune --no-tags
          EXPECTED_SHA="$(git rev-parse "origin/${R1_BRANCH}")"
          echo "${EXPECTED_SHA}"

          echo

          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::The checked-out commit does not match the current R1 execution branch tip."
            echo "::error::Expected: ${EXPECTED_SHA}"
            echo "::error::Actual:   ${ACTUAL_SHA}"
            exit 1
          fi

          echo "R1 branch/commit identity: PASS"

          echo

          echo "Recent commits:"
          git log -5 --oneline

          echo

          test -f package.json || {
            echo "::error::package.json was not found."
            exit 1
          }

          echo "R1 commit SHA: ${ACTUAL_SHA}" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 3. NODE
      #
      # The application continues to test on Node 22.
      #
      # actions/setup-node@v7 itself runs using the current
      # Node 24-compatible GitHub Actions runtime.
      # ======================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm

      # ======================================================
      # 4. INSTALL
      # ======================================================

      - name: Install dependencies from lockfile
        run: npm ci

      # ======================================================
      # 5. SECURITY
      # ======================================================

      - name: Security audit
        run: npm audit --audit-level=high

      # ======================================================
      # 6. TYPECHECK
      # ======================================================

      - name: Core typecheck
        run: npm run typecheck:core --if-present

      - name: Static typecheck
        run: npm run typecheck:static --if-present

      - name: Application typecheck
        run: npm run typecheck --if-present

      # ======================================================
      # 7. LINT
      # ======================================================

      - name: Lint
        run: npm run lint --if-present

      # ======================================================
      # 8. TESTS
      # ======================================================

      - name: Unit and integration tests
        run: npm run test --if-present

      - name: Core smoke
        run: npm run test:core --if-present

      - name: V2 deterministic smoke
        run: node scripts/v2-smoke.cjs

      # ======================================================
      # 9. PRODUCTION BUILD
      # ======================================================

      - name: Production build
        run: npm run build

      # ======================================================
      # 10. PLAYWRIGHT
      # ======================================================

      - name: Install Playwright Chromium
        if: hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        if: hashFiles('playwright.config.*') != ''
        run: npm run e2e --if-present

      # ======================================================
      # 11. SUPABASE CLI
      #
      # Keep the proven v3 setup action and the known-good CLI
      # version used by the existing R1 gate.
      # ======================================================

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.117.0"

      # ======================================================
      # 12. VERIFY SUPABASE CREDENTIALS
      # ======================================================

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase credentials..."

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_[^[:space:]]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN does not look like a Supabase personal access token."
            echo "::error::It must begin with sbp_."
            exit 1
          fi

          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is missing."
            exit 1
          fi

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."
            exit 1
          fi

          echo "Supabase credential preflight: PASS"

      # ======================================================
      # 13. SHOW SUPABASE CLI VERSION
      # ======================================================

      - name: Verify Supabase CLI
        run: |
          set -euo pipefail

          supabase --version

      # ======================================================
      # 14. CHECK DOCKER AVAILABLE
      #
      # This Docker is provided by the GitHub-hosted runner.
      # You do NOT need Docker installed on your own computer.
      #
      # Supabase schema-diff operations can use a temporary
      # shadow database.
      # ======================================================

      - name: Verify GitHub runner Docker
        shell: bash
        run: |
          set -euo pipefail

          docker version

      # ======================================================
      # 15. LINK THE EXISTING TRUSTPAY SUPABASE PROJECT
      # ======================================================

      - name: Link TrustPay Supabase project
        shell: bash
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --password "${SUPABASE_DB_PASSWORD}"

          echo "Supabase project link: PASS"

      # ======================================================
      # 16. CREATE EVIDENCE DIRECTORY AND SHOW CURRENT STATE
      #
      # The directory is created unconditionally so that the
      # evidence-upload step always has something to upload.
      # ======================================================

      - name: Show Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-before.txt

      # ======================================================
      # 17. CHECK FOR PENDING MIGRATIONS
      #
      # Read-only. Nothing is changed here.
      # ======================================================

      - name: Check pending migrations
        shell: bash
        run: |
          set -euo pipefail

          supabase db push \
            --linked \
            --dry-run \
            | tee .r1-evidence/migration-dry-run.txt

      # ======================================================
      # 18. VERIFY CONFIRMATION FOR REMOTE CHANGES
      #
      # Any R1 certification run that applies or reconciles
      # Supabase migrations must explicitly provide the exact
      # confirmation string.
      #
      # This prevents accidental production migration changes.
      # ======================================================

      - name: Validate migration change authorization
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then
            echo "::error::Remote migration application/reconciliation was requested, but confirm_target is incorrect."
            echo "::error::Type exactly: TRUSTPAY-R1-SUPABASE-APPLY"
            exit 1
          fi

          echo "Remote migration authorization: PASS"

      # ======================================================
      # 19. SAFE BASELINE-RECONCILIATION PREFLIGHT
      #
      # IMPORTANT:
      #
      # We do NOT repair migration history simply because a
      # schema object already exists.
      #
      # First:
      #   1. Locate the exact baseline migration.
      #   2. Reject obvious data-changing statements.
      #   3. Reject DO blocks.
      #   4. Compare repository migrations against the linked
      #      remote database.
      #
      # Only if there is NO schema difference do we conclude:
      #
      #   "The schema already exists remotely and only the
      #    migration-history record is missing."
      #
      # Only then is migration-history repair allowed.
      # ======================================================

      - name: Verify baseline migration is safe to reconcile
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_FILE=""

          while IFS= read -r file; do
            MIGRATION_FILE="${file}"
            break
          done < <(
            find supabase/migrations \
              -maxdepth 1 \
              -type f \
              -name "${R1_BASELINE_MIGRATION}_*.sql" \
              -print
          )

          if [[ -z "${MIGRATION_FILE}" ]]; then
            echo "::error::Could not find migration ${R1_BASELINE_MIGRATION} in supabase/migrations."
            exit 1
          fi

          echo "Baseline migration file:"
          echo "${MIGRATION_FILE}"

          echo

          echo "Checking migration for obvious data-changing statements..."

          if grep -Ein \
            '^[[:space:]]*(insert|update|delete|merge|copy)[[:space:]]' \
            "${MIGRATION_FILE}" \
            > .r1-evidence/baseline-data-change-check.txt; then

            echo "::error::The baseline migration contains data-changing SQL."
            echo "::error::Migration history will NOT be repaired automatically."
            echo
            cat .r1-evidence/baseline-data-change-check.txt
            exit 1
          fi

          : > .r1-evidence/baseline-data-change-check.txt
          echo "No obvious data-changing SQL detected."

          echo

          if grep -Eiq \
            '^[[:space:]]*do[[:space:]]+\$\$' \
            "${MIGRATION_FILE}"; then

            echo "::error::The baseline migration contains a DO block."
            echo "::error::Automatic migration-history repair is disabled for this migration."
            exit 1
          fi

          echo "No DO block detected."

          echo

          echo "Comparing repository migrations against the linked remote database..."

          DIFF_FILE=".r1-evidence/r1-baseline-schema-diff.sql"

          rm -f "${DIFF_FILE}"

          supabase db diff \
            --linked \
            --use-pg-delta \
            --output "${DIFF_FILE}"

          touch "${DIFF_FILE}"

          if [[ -s "${DIFF_FILE}" ]]; then

            echo "::error::The repository migration schema does NOT exactly match the remote database."
            echo "::error::Migration history will NOT be repaired automatically."
            echo
            echo "Schema differences found:"
            echo
            cat "${DIFF_FILE}"

            exit 1

          fi

          echo "Remote schema comparison: PASS"
          echo "No schema differences were detected."

          echo

          echo "The migration can therefore be treated as an already-applied baseline whose remote history record is missing."

      # ======================================================
      # 20. REPAIR THE REMOTE MIGRATION HISTORY
      #
      # IMPORTANT:
      #
      # This does NOT execute the baseline SQL again.
      #
      # It only records the baseline migration as applied after
      # Step 19 proved schema equivalence.
      # ======================================================

      - name: Repair baseline migration history
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repairing remote migration history..."

          supabase migration repair \
            "${R1_BASELINE_MIGRATION}" \
            --status applied \
            --linked

          echo "Baseline migration history repair: PASS"

      # ======================================================
      # 21. SHOW MIGRATION HISTORY AFTER REPAIR
      # ======================================================

      - name: Verify migration history after reconciliation
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-after-repair.txt

      # ======================================================
      # 22. APPLY ALL REMAINING MIGRATIONS
      #
      # `--yes` prevents the interactive:
      #
      #   "Do you want to push these migrations?"
      #
      # prompt that caused CI trouble previously.
      # ======================================================

      - name: Apply remaining Supabase migrations
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying remaining TrustPay migrations..."

          supabase \
            --yes \
            db push \
            --linked

          echo "Remaining Supabase migration apply: PASS"

      # ======================================================
      # 23. FINAL MIGRATION STATE
      # ======================================================

      - name: Confirm final Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-final.txt

      # ======================================================
      # 24. LINKED REMOTE DATABASE LINT
      #
      # `--linked` prevents the CLI from trying to lint the
      # local 127.0.0.1:54322 database.
      # ======================================================

      - name: Lint linked TrustPay Supabase database
        shell: bash
        run: |
          set -euo pipefail

          echo "Linting the LINKED remote TrustPay database..."

          supabase db lint \
            --linked \
            --fail-on error

          echo "Linked remote database lint: PASS"

      # ======================================================
      # 25. PROTECTED VERCEL PREVIEW SMOKE
      #
      # IMPORTANT:
      #
      # Use only:
      #
      #   x-vercel-protection-bypass
      #
      # Do NOT add:
      #
      #   x-vercel-set-bypass-cookie
      #
      # The cookie header previously caused the unwanted 307
      # redirect behavior.
      # ======================================================

      - name: Protected Vercel Preview smoke
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PREVIEW_URL:-}" ]]; then
            echo "::error::No Vercel Preview URL was supplied."
            exit 1
          fi

          PREVIEW_URL="${PREVIEW_URL%/}"

          if [[ "${PREVIEW_URL}" != https://* ]]; then
            echo "::error::Preview URL must begin with https://"
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          HEADER_FILE="$(mktemp)"

          cleanup() {
            rm -f "${BODY_FILE}" "${HEADER_FILE}"
          }

          trap cleanup EXIT

          CURL_RESULT="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 10 \
              --proto '=https' \
              --proto-redir '=https' \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              --header "User-Agent: TrustPay-R1-Preview-Smoke/1.0" \
              --dump-header "${HEADER_FILE}" \
              --output "${BODY_FILE}" \
              --write-out '%{http_code}\n%{url_effective}' \
              "${PREVIEW_URL}/"
          )"

          HTTP_STATUS="$(printf '%s\n' "${CURL_RESULT}" | sed -n '1p')"

          FINAL_URL="$(printf '%s\n' "${CURL_RESULT}" | sed -n '2p')"

          echo "HTTP_STATUS=${HTTP_STATUS}"

          echo "FINAL_URL=${FINAL_URL}"

          if [[ "${FINAL_URL}" == *"vercel.com/login"* ]]; then
            echo "::error::Preview redirected to Vercel authentication."
            exit 1
          fi

          if [[ ! "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Preview did not return a successful final HTTP status."
            echo "::error::HTTP status: ${HTTP_STATUS}"
            exit 1
          fi

          if ! grep -qi "TrustPay" "${BODY_FILE}"; then
            echo "::error::Preview returned a page that does not contain recognizable TrustPay content."
            exit 1
          fi

          echo "Vercel Preview smoke: PASS"

      # ======================================================
      # 26. RECORD R1 RELEASE EVIDENCE
      # ======================================================

      - name: Record R1 release evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          R1_SHA="$(git rev-parse HEAD)"

          {
            echo "TRUSTPAY R1 RELEASE EVIDENCE"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "R1_BRANCH=${R1_BRANCH}"
            echo "R1_SHA=${R1_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "PREVIEW_URL=${{ inputs.preview_url }}"
            echo "REMOTE_MIGRATIONS_APPLIED=${{ inputs.apply_remote_migrations }}"
            echo "KNOWN_BASELINE_MIGRATION=${R1_BASELINE_MIGRATION}"
            echo "BASELINE_RECONCILIATION_POLICY=SCHEMA-EQUIVALENCE-BEFORE-HISTORY-REPAIR"
          } > .r1-evidence/release-context.txt

          echo "R1 release evidence context written."

      # ======================================================
      # 27. UPLOAD R1 EVIDENCE
      #
      # IMPORTANT FIX:
      #
      # `.r1-evidence` is a hidden directory because it starts
      # with a dot.
      #
      # Current upload-artifact behavior excludes hidden files
      # unless include-hidden-files is explicitly enabled.
      #
      # This is why the previous run could say:
      #
      #   No files were found with the provided path: .r1-evidence/
      #
      # while the workflow itself had created that directory.
      # ======================================================

      - name: Upload R1 evidence
        uses: actions/upload-artifact@v6
        with:
          name: trustpay-r1-evidence-${{ github.run_id }}
          path: .r1-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # ======================================================
      # 28. ENFORCE CERTIFICATION PRECONDITION
      #
      # R1 certification requires that the remote Supabase
      # migration reconciliation/application path was
      # intentionally executed.
      #
      # This prevents a future manual run with:
      #
      #   apply_remote_migrations = false
      #
      # from accidentally claiming a certified release.
      # ======================================================

      - name: Enforce R1 certification precondition
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.apply_remote_migrations }}" != "true" ]]; then
            echo "::error::R1 certification requires apply_remote_migrations=true."
            echo "::error::Run the release gate again with intentional migration application/reconciliation."
            exit 1
          fi

          if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then
            echo "::error::R1 certification requires confirm_target=TRUSTPAY-R1-SUPABASE-APPLY."
            exit 1
          fi

          echo "R1 certification precondition: PASS"

      # ======================================================
      # 29. CREATE OR VERIFY R1 CERTIFICATION TAG
      #
      # IMPORTANT:
      #
      # We use the ACTUAL checked-out HEAD:
      #
      #   git rev-parse HEAD
      #
      # NOT:
      #
      #   github.sha
      #
      # because a workflow may be manually dispatched from main
      # while intentionally checking out the R1 execution branch.
      #
      # Behavior:
      #
      # - If v2.0.0-r1 does not exist:
      #     create it at the validated R1 HEAD.
      #
      # - If v2.0.0-r1 already exists at the same commit:
      #     succeed and leave it untouched.
      #
      # - If v2.0.0-r1 exists at another commit:
      #     FAIL.
      #
      # The workflow NEVER retargets the certification tag.
      # ======================================================

      - name: Create or verify R1 certification tag
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-r1"
          R1_SHA="$(git rev-parse HEAD)"

          echo "R1 certification target:"
          echo "  Branch: ${R1_BRANCH}"
          echo "  Commit: ${R1_SHA}"
          echo "  Tag:    ${TAG}"

          echo
          echo "Checking whether ${TAG} already exists remotely..."

          if git ls-remote \
            --exit-code \
            --refs \
            origin \
            "refs/tags/${TAG}" \
            >/dev/null 2>&1; then

            echo "${TAG} already exists."

            echo
            echo "Fetching existing certification tag for exact commit verification..."

            git fetch \
              origin \
              "refs/tags/${TAG}:refs/tags/${TAG}"

            EXISTING_SHA="$(git rev-list -n 1 "${TAG}^{commit}")"

            echo "Existing tag commit: ${EXISTING_SHA}"
            echo "Validated R1 commit: ${R1_SHA}"

            if [[ "${EXISTING_SHA}" != "${R1_SHA}" ]]; then
              echo
              echo "::error::Certification tag ${TAG} already exists at a DIFFERENT commit."
              echo "::error::Existing tag commit: ${EXISTING_SHA}"
              echo "::error::Validated R1 commit: ${R1_SHA}"
              echo "::error::The certification tag will NOT be retargeted."
              exit 1
            fi

            echo
            echo "=============================================="
            echo "TRUSTPAY R1 CERTIFICATION TAG VERIFIED"
            echo "=============================================="
            echo "Tag:    ${TAG}"
            echo "Commit: ${R1_SHA}"
            echo "Result: Existing tag already points to the exact validated R1 commit."
            echo "=============================================="

            exit 0
          fi

          echo "${TAG} does not exist."

          echo
          echo "Creating immutable annotated certification tag..."

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            -a \
            "${TAG}" \
            "${R1_SHA}" \
            -m "TrustPay R1 certification ${TAG}"

          echo
          echo "Pushing certification tag..."

          if git push \
            origin \
            "refs/tags/${TAG}"; then

            echo
            echo "=============================================="
            echo "TRUSTPAY R1 CERTIFICATION TAG CREATED"
            echo "=============================================="
            echo "Tag:    ${TAG}"
            echo "Commit: ${R1_SHA}"
            echo "=============================================="

            exit 0

          fi

          # A concurrent process may have created the tag after
          # our first existence check. Never overwrite it.
          echo
          echo "::warning::Tag push did not succeed. Re-checking whether another process created ${TAG}."

          git tag -d "${TAG}" >/dev/null 2>&1 || true

          git fetch \
            origin \
            "refs/tags/${TAG}:refs/tags/${TAG}" \
            || {
              echo "::error::Unable to confirm the certification tag after the failed push."
              exit 1
            }

          EXISTING_SHA="$(git rev-list -n 1 "${TAG}^{commit}")"

          echo "Existing tag commit after race check: ${EXISTING_SHA}"
          echo "Validated R1 commit: ${R1_SHA}"

          if [[ "${EXISTING_SHA}" != "${R1_SHA}" ]]; then
            echo "::error::The certification tag exists at a different commit."
            echo "::error::Existing tag commit: ${EXISTING_SHA}"
            echo "::error::Validated R1 commit: ${R1_SHA}"
            echo "::error::The certification tag will NOT be retargeted."
            exit 1
          fi

          echo
          echo "=============================================="
          echo "TRUSTPAY R1 CERTIFICATION TAG VERIFIED"
          echo "=============================================="
          echo "Tag:    ${TAG}"
          echo "Commit: ${R1_SHA}"
          echo "Result: Concurrent tag creation resolved safely; tag matches validated commit."
          echo "=============================================="
