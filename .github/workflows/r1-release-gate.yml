name: TrustPay R1 Release Gate on: workflow_dispatch: inputs: preview_url: description: "Exact Vercel Preview URL for the current R1 deployment" required: true type: string apply_remote_migrations: description: "Apply repository migrations to the configured TrustPay Supabase project" required: true type: boolean default: false confirm_target: description: "Type TRUSTPAY-R1-SUPABASE-APPLY only when intentionally applying migrations" required: false type: string default: "" permissions: contents: write concurrency: group: trustpay-r1-release-gate cancel-in-progress: true jobs: release-gate: name: TrustPay R1 Complete Gate runs-on: ubuntu-latest # ========================================================== # JOB-LEVEL ENVIRONMENT # # These values are intentionally defined here instead of # inside individual steps. # # This means every Supabase command in this job receives: # # SUPABASE_ACCESS_TOKEN # SUPABASE_DB_PASSWORD # SUPABASE_PROJECT_ID # # This prevents the earlier: # # "Access token not provided" # # problem from returning in a later Supabase step. # ========================================================== env: R1_BRANCH: v2.0.0-execution-r1 NODE_VERSION: "22" SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }} SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }} SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }} VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }} steps: # ======================================================== # 1. CHECK OUT THE ACTUAL R1 APPLICATION BRANCH # ======================================================== - name: Checkout R1 branch uses: actions/checkout@v4 with: ref: v2.0.0-execution-r1 fetch-depth: 0 # ======================================================== # 2. VERIFY THE CHECKED-OUT COMMIT # ======================================================== - name: Verify R1 branch and commit shell: bash run: | set -euo pipefail echo "Expected R1 branch:" echo "${R1_BRANCH}" echo echo "Actual commit:" git rev-parse HEAD echo echo "Recent commits:" git log -5 --oneline echo echo "Checking package.json..." test -f package.json || { echo "::error::package.json was not found." exit 1 } # ======================================================== # 3. NODE.JS # ======================================================== - name: Setup Node.js 22 uses: actions/setup-node@v4 with: node-version: "22" cache: npm # ======================================================== # 4. DETERMINISTIC DEPENDENCY INSTALLATION # ======================================================== - name: Install dependencies from lockfile run: npm ci # ======================================================== # 5. SECURITY AUDIT # ======================================================== - name: Security audit run: npm audit --audit-level=high # ======================================================== # 6. TYPECHECKS # ======================================================== - name: Core typecheck run: npm run typecheck:core --if-present - name: Static typecheck run: npm run typecheck:static --if-present - name: Application typecheck run: npm run typecheck --if-present # ======================================================== # 7. LINT # ======================================================== - name: Lint run: npm run lint --if-present # ======================================================== # 8. UNIT + INTEGRATION TESTS # ======================================================== - name: Unit and integration tests run: npm run test --if-present # ======================================================== # 9. CORE SMOKE # ======================================================== - name: Core smoke run: npm run test:core --if-present # ======================================================== # 10. V2 DETERMINISTIC SMOKE # ======================================================== - name: V2 deterministic smoke run: node scripts/v2-smoke.cjs # ======================================================== # 11. PRODUCTION BUILD # ======================================================== - name: Production build run: npm run build # ======================================================== # 12. PLAYWRIGHT # ======================================================== - name: Install Playwright Chromium if: hashFiles('playwright.config.*') != '' run: npx playwright install --with-deps chromium - name: Browser E2E if: hashFiles('playwright.config.*') != '' run: npm run e2e --if-present # ======================================================== # 13. SUPABASE CLI # ======================================================== - name: Install Supabase CLI uses: supabase/setup-cli@v1 with: version: "2.117.0" # ======================================================== # 14. CREDENTIAL PRECHECK # # This catches the two previous Supabase failures: # # A. Missing token # B. Wrong token type # # IMPORTANT: # The token VALUE itself is never printed. # ======================================================== - name: Validate Supabase credentials shell: bash run: | set -euo pipefail echo "Checking Supabase automation credentials..." # ----------------------------------------------------- # ACCESS TOKEN # ----------------------------------------------------- if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then echo "::error::SUPABASE_ACCESS_TOKEN is missing." echo "::error::Create/update a GitHub Actions secret named exactly:" echo "::error::SUPABASE_ACCESS_TOKEN" exit 1 fi # ----------------------------------------------------- # CURRENT SUPABASE CLI PAT FORMAT # # Current personal access tokens begin with: # # sbp_ # ----------------------------------------------------- if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_[^[:space:]]+$ ]]; then echo "::error::SUPABASE_ACCESS_TOKEN has an invalid format." echo "::error::It must be a Supabase personal access token beginning with sbp_." echo "::error::Do NOT use:" echo "::error::- publishable key" echo "::error::- secret/service-role key" echo "::error::- database password" echo "::error::- project API key" exit 1 fi # ----------------------------------------------------- # DATABASE PASSWORD # ----------------------------------------------------- if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then echo "::error::SUPABASE_DB_PASSWORD is missing." exit 1 fi # ----------------------------------------------------- # PROJECT REFERENCE # ----------------------------------------------------- if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then echo "::error::SUPABASE_PROJECT_ID is missing." exit 1 fi # ----------------------------------------------------- # VERCEL AUTOMATION SECRET # ----------------------------------------------------- if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing." exit 1 fi echo echo "Supabase credential preflight: PASS" echo "Vercel automation credential preflight: PASS" # ======================================================== # 15. SHOW SUPABASE CLI VERSION # ======================================================== - name: Verify Supabase CLI run: | set -euo pipefail supabase --version # ======================================================== # 16. LINK THE EXISTING TRUSTPAY SUPABASE PROJECT # # Authentication comes from JOB-LEVEL env. # ======================================================== - name: Link TrustPay Supabase project shell: bash run: | set -euo pipefail echo "Linking TrustPay Supabase project..." supabase link \ --project-ref "${SUPABASE_PROJECT_ID}" \ --password "${SUPABASE_DB_PASSWORD}" echo "Supabase link: PASS" # ======================================================== # 17. REMOTE MIGRATION STATE # ======================================================== - name: Show Supabase migration state shell: bash run: | set -euo pipefail echo "Remote/local migration comparison:" supabase migration list # ======================================================== # 18. REMOTE MIGRATION DRY RUN # # This MUST NOT modify the database. # ======================================================== - name: Supabase migration dry run shell: bash run: | set -euo pipefail echo "Running Supabase migration dry run..." supabase db push --dry-run echo "Supabase migration dry run: PASS" # ======================================================== # 19. OPTIONAL REAL MIGRATION APPLY # ======================================================== - name: Apply Supabase migrations if: ${{ inputs.apply_remote_migrations == true }} shell: bash run: | set -euo pipefail if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then echo "::error::Remote migration application was requested." echo "::error::The required confirmation text was not supplied correctly." echo "::error::Required exact text:" echo "::error::TRUSTPAY-R1-SUPABASE-APPLY" exit 1 fi echo "Applying approved R1 migrations..." supabase db push echo "Supabase migration apply: PASS" # ======================================================== # 20. VERIFY FINAL MIGRATION STATE # ======================================================== - name: Confirm final Supabase migration state shell: bash run: | set -euo pipefail echo "Final migration state:" supabase migration list # ======================================================== # 21. IMPORTANT FIX: # # `supabase db lint` # # means LOCAL database by default. # # `supabase db lint --linked` # # means the linked REMOTE project. # # This is the direct fix for: # # ECONNREFUSED 127.0.0.1:54322 # ======================================================== - name: Lint linked TrustPay Supabase database shell: bash run: | set -euo pipefail echo "Running Supabase database lint against the LINKED remote TrustPay project..." supabase db lint \ --linked \ --fail-on error echo "Linked Supabase database lint: PASS" # ======================================================== # 22. PROTECTED VERCEL PREVIEW SMOKE # ======================================================== - name: Protected Vercel Preview smoke env: PREVIEW_URL: ${{ inputs.preview_url }} shell: bash run: | set -euo pipefail if [[ -z "${PREVIEW_URL:-}" ]]; then echo "::error::No Vercel Preview URL was supplied." exit 1 fi if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing." exit 1 fi python3 - <<'PY' import os import sys import urllib.error import urllib.request preview_url = os.environ["PREVIEW_URL"].rstrip("/") + "/" bypass_secret = os.environ["VERCEL_AUTOMATION_BYPASS_SECRET"] request = urllib.request.Request( preview_url, method="GET", headers={ "x-vercel-protection-bypass": bypass_secret, "x-vercel-set-bypass-cookie": "true", "User-Agent": "TrustPay-R1-Preview-Smoke/1.0", }, ) try: with urllib.request.urlopen( request, timeout=30 ) as response: final_url = response.geturl() body = response.read( 50000 ).decode( "utf-8", "replace" ) print( "HTTP_STATUS=" + str(response.status) ) print( "FINAL_URL=" + final_url ) # ------------------------------------------------ # Do not accept Vercel authentication as success. # ------------------------------------------------ if "vercel.com/login" in final_url: print( "FAIL: Vercel Preview redirected to Vercel authentication." ) sys.exit(1) # ------------------------------------------------ # Accept only normal application response. # ------------------------------------------------ if response.status < 200 or response.status >= 400: print( "FAIL: Unexpected HTTP response status." ) sys.exit(1) # ------------------------------------------------ # Make sure this is actually TrustPay. # ------------------------------------------------ if "TrustPay" not in body: print( "FAIL: Response does not appear to be the TrustPay application." ) sys.exit(1) print( "PASS: Protected TrustPay Preview is reachable." ) except urllib.error.HTTPError as exc: print( "HTTP_ERROR=" + str(exc.code) ) print( exc.read( 5000 ).decode( "utf-8", "replace" ) ) sys.exit(1) except urllib.error.URLError as exc: print( "NETWORK_ERROR=" + str(exc) ) sys.exit(1) # ======================================================== # 23. RECORD R1 EVIDENCE # ======================================================== - name: Record R1 evidence shell: bash run: | set -euo pipefail mkdir -p .r1-evidence R1_SHA="$(git rev-parse HEAD)" { echo "TRUSTPAY R1 RELEASE EVIDENCE" echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" echo "R1_BRANCH=${R1_BRANCH}" echo "R1_SHA=${R1_SHA}" echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}" echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" echo "PREVIEW_URL=${{ inputs.preview_url }}" echo "REMOTE_MIGRATIONS_APPLIED=${{ inputs.apply_remote_migrations }}" echo "SUPABASE_LINT_MODE=linked" } > .r1-evidence/context.txt # ======================================================== # 24. UPLOAD EVIDENCE # ======================================================== - name: Upload R1 evidence uses: actions/upload-artifact@v4 with: name: trustpay-r1-evidence-${{ github.run_id }} path: .r1-evidence/ # ======================================================== # 25. CREATE R1 CERTIFICATION TAG # # Certification occurs only if: # # 1. Every prior step passed. # 2. Real remote migration application was requested. # # The tag points to the exact checked-out R1 commit. # ======================================================== - name: Create R1 certification tag if: ${{ success() && inputs.apply_remote_migrations == true }} shell: bash run: | set -euo pipefail TAG="v2.0.0-r1" R1_SHA="$(git rev-parse HEAD)" echo "Preparing R1 certification." echo "Tag:" echo "${TAG}" echo "R1 commit:" echo "${R1_SHA}" # ------------------------------------------------------ # Never overwrite an existing release tag. # ------------------------------------------------------ if git ls-remote \ --exit-code \ --refs \ origin \ "refs/tags/${TAG}" \ >/dev/null 2>&1; then echo "::error::Tag ${TAG} already exists." echo "::error::Existing release tags are never overwritten." exit 1 fi # ------------------------------------------------------ # Configure bot identity. # ------------------------------------------------------ git config \ user.name \ "github-actions[bot]" git config \ user.email \ "41898282+github-actions[bot]@users.noreply.github.com" # ------------------------------------------------------ # Create annotated tag. # ------------------------------------------------------ git tag \ -a "${TAG}" \ "${R1_SHA}" \ -m "TrustPay R1 certification ${TAG}" # ------------------------------------------------------ # Push only the new tag. # ------------------------------------------------------ git push \ origin \ "refs/tags/${TAG}" echo echo "==============================================" echo "TRUSTPAY R1 CERTIFICATION TAG CREATED" echo "==============================================" echo "Tag: ${TAG}" echo "Commit: ${R1_SHA}" echo "=============================================="
