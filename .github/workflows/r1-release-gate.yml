name: TrustPay R1 Release Gate

on:
  workflow_dispatch:
    inputs:

      preview_url:
        description: "Exact Vercel Preview URL for the current R1 deployment"
        required: true
        type: string

      apply_remote_migrations:
        description: "Apply/reconcile R1 Supabase migrations"
        required: true
        type: boolean
        default: false

      confirm_target:
        description: "Type TRUSTPAY-R1-SUPABASE-APPLY only when intentionally applying/reconciling R1 migrations"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: trustpay-r1-release-gate
  cancel-in-progress: true

jobs:

  release-gate:

    name: TrustPay R1 Complete Gate

    runs-on: ubuntu-latest

    env:

      # ======================================================
      # TRUSTPAY RELEASE TARGET
      # ======================================================

      R1_BRANCH: v2.0.0-execution-r1

      NODE_VERSION: "22"

      # ======================================================
      # SUPABASE
      #
      # IMPORTANT:
      #
      # These are JOB-LEVEL variables.
      #
      # Every Supabase CLI step therefore receives the
      # credentials.
      # ======================================================

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # ======================================================
      # VERCEL
      # ======================================================

      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # ======================================================
      # KNOWN BASELINE MIGRATION
      #
      # This is the migration that is currently failing because
      # the remote database already contains its schema objects.
      # ======================================================

      R1_BASELINE_MIGRATION: "20260918000000"

    steps:

      # ======================================================
      # 1. CHECK OUT R1
      # ======================================================

      - name: Checkout R1 branch
        uses: actions/checkout@v4
        with:
          ref: v2.0.0-execution-r1
          fetch-depth: 0

      # ======================================================
      # 2. VERIFY R1
      # ======================================================

      - name: Verify R1 branch and commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected branch:"
          echo "${R1_BRANCH}"

          echo

          echo "Actual commit:"
          git rev-parse HEAD

          echo

          echo "Recent commits:"
          git log -5 --oneline

          echo

          test -f package.json || {
            echo "::error::package.json was not found."
            exit 1
          }

      # ======================================================
      # 3. NODE
      # ======================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ======================================================
      # 4. INSTALL
      # ======================================================

      - name: Install dependencies from lockfile
        run: npm ci

      # ======================================================
      # 5. SECURITY
      # ======================================================

      - name: Security audit
        run: npm audit --audit-level=high

      # ======================================================
      # 6. TYPECHECK
      # ======================================================

      - name: Core typecheck
        run: npm run typecheck:core --if-present

      - name: Static typecheck
        run: npm run typecheck:static --if-present

      - name: Application typecheck
        run: npm run typecheck --if-present

      # ======================================================
      # 7. LINT
      # ======================================================

      - name: Lint
        run: npm run lint --if-present

      # ======================================================
      # 8. TESTS
      # ======================================================

      - name: Unit and integration tests
        run: npm run test --if-present

      - name: Core smoke
        run: npm run test:core --if-present

      - name: V2 deterministic smoke
        run: node scripts/v2-smoke.cjs

      # ======================================================
      # 9. PRODUCTION BUILD
      # ======================================================

      - name: Production build
        run: npm run build

      # ======================================================
      # 10. PLAYWRIGHT
      # ======================================================

      - name: Install Playwright Chromium
        if: hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        if: hashFiles('playwright.config.*') != ''
        run: npm run e2e --if-present

      # ======================================================
      # 11. SUPABASE CLI
      # ======================================================

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.117.0"

      # ======================================================
      # 12. VERIFY SUPABASE CREDENTIALS
      # ======================================================

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase credentials..."

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_[^[:space:]]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN does not look like a Supabase personal access token."
            echo "::error::It must begin with sbp_."
            exit 1
          fi

          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is missing."
            exit 1
          fi

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."
            exit 1
          fi

          echo "Supabase credential preflight: PASS"

      # ======================================================
      # 13. SHOW SUPABASE CLI VERSION
      # ======================================================

      - name: Verify Supabase CLI
        run: |
          set -euo pipefail

          supabase --version

      # ======================================================
      # 14. CHECK DOCKER AVAILABLE
      #
      # IMPORTANT:
      #
      # This is Docker inside the GitHub-hosted runner.
      #
      # You do NOT need Docker on your own computer.
      #
      # Supabase db diff uses a temporary shadow database.
      # ======================================================

      - name: Verify GitHub runner Docker
        shell: bash
        run: |
          set -euo pipefail

          docker version

      # ======================================================
      # 15. LINK THE EXISTING TRUSTPAY SUPABASE PROJECT
      # ======================================================

      - name: Link TrustPay Supabase project
        shell: bash
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --password "${SUPABASE_DB_PASSWORD}"

          echo "Supabase project link: PASS"

      # ======================================================
      # 16. SHOW CURRENT MIGRATION STATE
      # ======================================================

      - name: Show Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          supabase migration list --linked \
            | tee .r1-evidence/migration-state-before.txt

      # ======================================================
      # 17. CHECK FOR PENDING MIGRATIONS
      #
      # This is read-only.
      # ======================================================

      - name: Check pending migrations
        shell: bash
        run: |
          set -euo pipefail

          supabase db push \
            --linked \
            --dry-run \
            | tee .r1-evidence/migration-dry-run.txt

      # ======================================================
      # 18. SAFE BASELINE-RECONCILIATION PREFLIGHT
      #
      # This is the IMPORTANT NEW FIX.
      #
      # We do NOT automatically repair history just because
      # verification_state exists.
      #
      # We first compare the repository's migration result
      # against the actual remote database.
      #
      # `supabase db diff --linked` creates a temporary shadow
      # database from the repository migrations and compares it
      # against the linked remote project.
      #
      # If there are schema differences, we STOP.
      #
      # If there are NO schema differences, we can safely say:
      #
      # "The schema represented by this migration is already
      # present remotely; only migration history is missing."
      # ======================================================

      - name: Verify baseline migration is safe to reconcile
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_FILE=""

          while IFS= read -r file; do
            MIGRATION_FILE="${file}"
            break
          done < <(
            find supabase/migrations \
              -maxdepth 1 \
              -type f \
              -name "${R1_BASELINE_MIGRATION}_*.sql" \
              -print
          )

          if [[ -z "${MIGRATION_FILE}" ]]; then
            echo "::error::Could not find migration ${R1_BASELINE_MIGRATION} in supabase/migrations."
            exit 1
          fi

          echo "Baseline migration file:"
          echo "${MIGRATION_FILE}"

          echo

          echo "Checking migration for obvious data-changing statements..."

          if grep -Ein \
            '^[[:space:]]*(insert|update|delete|merge|copy)[[:space:]]' \
            "${MIGRATION_FILE}" \
            > .r1-evidence/baseline-data-change-check.txt; then

            echo "::error::The baseline migration contains data-changing SQL."
            echo "::error::Migration history will NOT be repaired automatically."
            echo
            cat .r1-evidence/baseline-data-change-check.txt
            exit 1
          fi

          if grep -Eiq \
            '^[[:space:]]*do[[:space:]]+\$\$' \
            "${MIGRATION_FILE}"; then

            echo "::error::The baseline migration contains a DO block."
            echo "::error::Automatic migration-history repair is disabled for this migration."
            exit 1
          fi

          echo "No obvious data-changing SQL detected."

          echo

          echo "Comparing repository migrations against the linked remote database..."

          DIFF_FILE=".r1-evidence/r1-baseline-schema-diff.sql"

          rm -f "${DIFF_FILE}"

          supabase db diff \
            --linked \
            --use-pg-delta \
            --output "${DIFF_FILE}"

          touch "${DIFF_FILE}"

          if [[ -s "${DIFF_FILE}" ]]; then

            echo "::error::The repository migration schema does NOT exactly match the remote database."
            echo "::error::Migration history will NOT be repaired automatically."
            echo
            echo "Schema differences found:"
            echo
            cat "${DIFF_FILE}"

            exit 1

          fi

          echo "Remote schema comparison: PASS"
          echo "No schema differences were detected."

          echo

          echo "The migration can therefore be treated as an already-applied baseline whose remote history record is missing."

      # ======================================================
      # 19. REPAIR THE REMOTE MIGRATION HISTORY
      #
      # IMPORTANT:
      #
      # This DOES NOT execute the migration SQL.
      #
      # It only records the migration as applied because the
      # previous step proved that the corresponding schema is
      # already present.
      #
      # Supabase documents this exact repair workflow.
      # ======================================================

      - name: Repair baseline migration history
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repairing remote migration history..."

          supabase migration repair \
            "${R1_BASELINE_MIGRATION}" \
            --status applied \
            --linked

          echo "Baseline migration history repair: PASS"

      # ======================================================
      # 20. SHOW MIGRATION HISTORY AFTER REPAIR
      # ======================================================

      - name: Verify migration history after reconciliation
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-after-repair.txt

      # ======================================================
      # 21. APPLY ALL REMAINING MIGRATIONS
      #
      # `--yes` is the GLOBAL Supabase CLI flag.
      #
      # This prevents the:
      #
      # "Do you want to push these migrations?"
      #
      # prompt that appeared in your failed run.
      # ======================================================

      - name: Apply remaining Supabase migrations
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying remaining TrustPay migrations..."

          supabase \
            --yes \
            db push \
            --linked

          echo "Remaining Supabase migration apply: PASS"

      # ======================================================
      # 22. FINAL MIGRATION STATE
      # ======================================================

      - name: Confirm final Supabase migration state
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          supabase migration list \
            --linked \
            | tee .r1-evidence/migration-state-final.txt

      # ======================================================
      # 23. LINKED REMOTE DATABASE LINT
      #
      # IMPORTANT:
      #
      # `--linked` prevents the CLI from trying:
      #
      # 127.0.0.1:54322
      #
      # This is the permanent fix for the earlier local-lint
      # failure.
      # ======================================================

      - name: Lint linked TrustPay Supabase database
        shell: bash
        run: |
          set -euo pipefail

          echo "Linting the LINKED remote TrustPay database..."

          supabase db lint \
            --linked \
            --fail-on error

          echo "Linked remote database lint: PASS"

      # ======================================================
      # 24. PROTECTED VERCEL PREVIEW SMOKE
      #
      # IMPORTANT:
      #
      # We deliberately DO NOT use:
      #
      # x-vercel-set-bypass-cookie
      #
      # in this simple HTTP smoke test.
      #
      # This prevents the earlier HTTP 307 problem.
      # ======================================================

      - name: Protected Vercel Preview smoke
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PREVIEW_URL:-}" ]]; then
            echo "::error::No Vercel Preview URL was supplied."
            exit 1
          fi

          PREVIEW_URL="${PREVIEW_URL%/}"

          if [[ "${PREVIEW_URL}" != https://* ]]; then
            echo "::error::Preview URL must begin with https://"
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          HEADER_FILE="$(mktemp)"

          cleanup() {
            rm -f "${BODY_FILE}" "${HEADER_FILE}"
          }

          trap cleanup EXIT

          CURL_RESULT="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-redirs 10 \
              --proto '=https' \
              --proto-redir '=https' \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              --header "User-Agent: TrustPay-R1-Preview-Smoke/1.0" \
              --dump-header "${HEADER_FILE}" \
              --output "${BODY_FILE}" \
              --write-out '%{http_code}\n%{url_effective}' \
              "${PREVIEW_URL}/"
          )"

          HTTP_STATUS="$(printf '%s\n' "${CURL_RESULT}" | sed -n '1p')"

          FINAL_URL="$(printf '%s\n' "${CURL_RESULT}" | sed -n '2p')"

          echo "HTTP_STATUS=${HTTP_STATUS}"

          echo "FINAL_URL=${FINAL_URL}"

          if [[ "${FINAL_URL}" == *"vercel.com/login"* ]]; then
            echo "::error::Preview redirected to Vercel authentication."
            exit 1
          fi

          if [[ ! "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Preview did not return a successful final HTTP status."
            echo "::error::HTTP status: ${HTTP_STATUS}"
            exit 1
          fi

          if ! grep -qi "TrustPay" "${BODY_FILE}"; then
            echo "::error::Preview returned a page that does not contain recognizable TrustPay content."
            exit 1
          fi

          echo "Vercel Preview smoke: PASS"

      # ======================================================
      # 25. WRITE RELEASE EVIDENCE
      # ======================================================

      - name: Record R1 release evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          R1_SHA="$(git rev-parse HEAD)"

          {
            echo "TRUSTPAY R1 RELEASE EVIDENCE"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "R1_BRANCH=${R1_BRANCH}"
            echo "R1_SHA=${R1_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "PREVIEW_URL=${{ inputs.preview_url }}"
            echo "REMOTE_MIGRATIONS_APPLIED=${{ inputs.apply_remote_migrations }}"
            echo "KNOWN_BASELINE_MIGRATION=${R1_BASELINE_MIGRATION}"
            echo "BASELINE_RECONCILIATION_POLICY=SCHEMA-EQUIVALENCE-BEFORE-HISTORY-REPAIR"
          } > .r1-evidence/release-context.txt

      # ======================================================
      # 26. UPLOAD EVIDENCE
      # ======================================================

      - name: Upload R1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: trustpay-r1-evidence-${{ github.run_id }}
          path: .r1-evidence/

      # ======================================================
      # 27. CREATE R1 CERTIFICATION TAG
      #
      # ONLY after every previous step has passed.
      # ======================================================

      - name: Create R1 certification tag
        if: ${{ success() && inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-r1"

          R1_SHA="$(git rev-parse HEAD)"

          echo "Checking whether ${TAG} already exists..."

          if git ls-remote \
            --exit-code \
            --refs \
            origin \
            "refs/tags/${TAG}" \
            >/dev/null 2>&1; then

            echo "::error::Tag ${TAG} already exists."
            echo "::error::No existing release tag will be overwritten."
            exit 1

          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            -a \
            "${TAG}" \
            "${R1_SHA}" \
            -m "TrustPay R1 certification ${TAG}"

          git push \
            origin \
            "refs/tags/${TAG}"

          echo
          echo "=============================================="
          echo "TRUSTPAY R1 CERTIFICATION TAG CREATED"
          echo "=============================================="
          echo "Tag: ${TAG}"
          echo "Commit: ${R1_SHA}"
          echo "=============================================="
