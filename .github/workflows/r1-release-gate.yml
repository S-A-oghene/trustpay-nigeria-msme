name: TrustPay R1 Release Gate

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact Vercel Preview URL for the current R1 deployment"
        required: true
        type: string

      apply_remote_migrations:
        description: "Apply repository migrations to the configured TrustPay Supabase project"
        required: true
        type: boolean
        default: false

      confirm_target:
        description: "Type TRUSTPAY-R1-SUPABASE-APPLY only when intentionally applying migrations"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: trustpay-r1-release-gate
  cancel-in-progress: true

env:
  R1_BRANCH: v2.0.0-execution-r1
  NODE_VERSION: "22"

jobs:
  release-gate:
    name: TrustPay R1 Complete Gate

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECK OUT THE ACTUAL R1 BRANCH
      # ------------------------------------------------------------

      - name: Checkout R1 branch
        uses: actions/checkout@v6.0.2
        with:
          ref: v2.0.0-execution-r1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify R1 branch and commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected R1 branch:"
          echo "${R1_BRANCH}"

          echo
          echo "Actual commit:"
          git rev-parse HEAD

          echo
          echo "Recent commits:"
          git log -5 --oneline

          if [[ ! -f package.json ]]; then
            echo "::error::package.json was not found."
            exit 1
          fi

      # ------------------------------------------------------------
      # 2. NODE / NPM
      # ------------------------------------------------------------

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      # ------------------------------------------------------------
      # 3. SECURITY / STATIC VALIDATION
      # ------------------------------------------------------------

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Core typecheck
        run: npm run typecheck:core --if-present

      - name: Static typecheck
        run: npm run typecheck:static --if-present

      - name: Application typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      # ------------------------------------------------------------
      # 4. TESTS
      # ------------------------------------------------------------

      - name: Unit and integration tests
        run: npm run test --if-present

      - name: Core smoke
        run: npm run test:core --if-present

      - name: V2 deterministic smoke
        run: node scripts/v2-smoke.cjs

      # ------------------------------------------------------------
      # 5. PRODUCTION BUILD
      # ------------------------------------------------------------

      - name: Production build
        run: npm run build

      # ------------------------------------------------------------
      # 6. PLAYWRIGHT
      # ------------------------------------------------------------

      - name: Install Playwright Chromium
        if: hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        if: hashFiles('playwright.config.*') != ''
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run e2e --if-present

      # ------------------------------------------------------------
      # 7. SUPABASE CLI
      #
      # Use the current v2 setup action rather than an older
      # Node 20-era action.
      # ------------------------------------------------------------

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.117.0"

      - name: Verify Supabase credentials are present and correctly formatted
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_[^[:space:]]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN has an invalid format."
            echo "::error::It must be a Supabase personal access token beginning with sbp_."
            echo "::error::Do not use a publishable key, secret key, service-role key, API key, or database password."
            exit 1
          fi

          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is missing."
            exit 1
          fi

          echo "Supabase credential format preflight: PASS"

      # ------------------------------------------------------------
      # 8. LINK THE EXISTING TRUSTPAY SUPABASE PROJECT
      # ------------------------------------------------------------

      - name: Link TrustPay Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --password "${SUPABASE_DB_PASSWORD}"

      # ------------------------------------------------------------
      # 9. CHECK REMOTE MIGRATION STATE
      # ------------------------------------------------------------

      - name: Show Supabase migration state
        run: |
          set -euo pipefail
          supabase migration list

      # ------------------------------------------------------------
      # 10. SAFE MIGRATION DRY RUN
      # ------------------------------------------------------------

      - name: Supabase migration dry run
        run: |
          set -euo pipefail

          supabase db push --dry-run

      # ------------------------------------------------------------
      # 11. OPTIONAL REAL MIGRATION APPLY
      # ------------------------------------------------------------

      - name: Apply Supabase migrations
        if: ${{ inputs.apply_remote_migrations }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then
            echo "::error::Remote migration application requested but the confirmation text is incorrect."
            exit 1
          fi

          echo "Applying repository migrations to the configured TrustPay Supabase project."

          supabase db push

      # ------------------------------------------------------------
      # 12. VERIFY MIGRATION STATE AFTER APPLY
      # ------------------------------------------------------------

      - name: Confirm final Supabase migration state
        run: |
          set -euo pipefail

          supabase migration list

      # ------------------------------------------------------------
      # 13. DATABASE LINT
      # ------------------------------------------------------------

      - name: Database lint
        run: |
          set -euo pipefail

          supabase db lint

      # ------------------------------------------------------------
      # 14. PROTECTED VERCEL PREVIEW SMOKE
      # ------------------------------------------------------------

      - name: Protected Vercel Preview smoke
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PREVIEW_URL:-}" ]]; then
            echo "::error::Preview URL is required."
            exit 1
          fi

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          preview_url = os.environ["PREVIEW_URL"].rstrip("/") + "/"
          bypass_secret = os.environ["VERCEL_AUTOMATION_BYPASS_SECRET"]

          request = urllib.request.Request(
              preview_url,
              method="GET",
              headers={
                  "x-vercel-protection-bypass": bypass_secret,
                  "x-vercel-set-bypass-cookie": "true",
                  "User-Agent": "TrustPay-R1-Preview-Smoke/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  final_url = response.geturl()
                  body = response.read(50000).decode("utf-8", "replace")

                  print("HTTP_STATUS=" + str(response.status))
                  print("FINAL_URL=" + final_url)

                  if "vercel.com/login" in final_url:
                      print("FAIL: Preview redirected to Vercel authentication.")
                      sys.exit(1)

                  if response.status < 200 or response.status >= 400:
                      print("FAIL: Unexpected HTTP status.")
                      sys.exit(1)

                  if "TrustPay" not in body:
                      print("FAIL: Response does not appear to be the TrustPay application.")
                      sys.exit(1)

                  print("PASS: Protected TrustPay Preview is reachable.")

          except urllib.error.HTTPError as exc:
              print("HTTP_ERROR=" + str(exc.code))
              print(exc.read(5000).decode("utf-8", "replace"))
              sys.exit(1)

          except urllib.error.URLError as exc:
              print("NETWORK_ERROR=" + str(exc))
              sys.exit(1)
          PY

      # ------------------------------------------------------------
      # 15. RELEASE EVIDENCE
      # ------------------------------------------------------------

      - name: Record R1 evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          R1_SHA="$(git rev-parse HEAD)"

          {
            echo "TRUSTPAY R1 RELEASE EVIDENCE"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "R1_BRANCH=${R1_BRANCH}"
            echo "R1_SHA=${R1_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "PREVIEW_URL=${{ inputs.preview_url }}"
            echo "REMOTE_MIGRATIONS_APPLIED=${{ inputs.apply_remote_migrations }}"
          } > .r1-evidence/context.txt

      - name: Upload R1 evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trustpay-r1-evidence-${{ github.run_id }}
          path: .r1-evidence/

      # ------------------------------------------------------------
      # 16. CREATE CERTIFICATION TAG
      #
      # Only a successful run WITH real migration-apply requested
      # can create v2.0.0-r1.
      # ------------------------------------------------------------

      - name: Create R1 certification tag
        if: ${{ success() && inputs.apply_remote_migrations }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-r1"
          R1_SHA="$(git rev-parse HEAD)"

          echo "Checking whether ${TAG} already exists."

          if git ls-remote --exit-code --refs origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Existing release tags are never overwritten."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" "${R1_SHA}" -m "TrustPay R1 certification ${TAG}"

          git push origin "refs/tags/${TAG}"

          echo "R1 certification tag created:"
          echo "${TAG}"
          echo "Commit:"
          echo "${R1_SHA}"
