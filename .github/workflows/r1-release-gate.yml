name: TrustPay R1 Release Gate

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact Vercel Preview URL for the current R1 deployment"
        required: true
        type: string

      apply_remote_migrations:
        description: "Apply repository migrations to the configured TrustPay Supabase project"
        required: true
        type: boolean
        default: false

      confirm_target:
        description: "Type TRUSTPAY-R1-SUPABASE-APPLY only when intentionally applying migrations"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: trustpay-r1-release-gate
  cancel-in-progress: true

# ============================================================
# IMPORTANT FIX
#
# These secrets are deliberately defined at JOB LEVEL.
#
# This makes the credentials available to EVERY step in this
# job, instead of only being available in one individual step.
#
# That fixes:
#
# "Access token not provided."
#
# for:
#   supabase link
#   supabase migration list
#   supabase db push --dry-run
#   supabase db push
#   supabase db lint
#   any other authenticated Supabase CLI command
# ============================================================

jobs:
  release-gate:

    name: TrustPay R1 Complete Gate

    runs-on: ubuntu-latest

    env:
      # ------------------------------------------------------
      # RELEASE TARGET
      # ------------------------------------------------------

      R1_BRANCH: v2.0.0-execution-r1
      NODE_VERSION: "22"

      # ------------------------------------------------------
      # SUPABASE CREDENTIALS
      #
      # These are JOB-LEVEL intentionally.
      # ------------------------------------------------------

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      # ------------------------------------------------------
      # VERCEL AUTOMATION
      #
      # Also job-level so E2E and Preview smoke use the same
      # credential without separate step-scoped configuration.
      # ------------------------------------------------------

      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:

      # ======================================================
      # 1. CHECKOUT EXACT R1 BRANCH
      # ======================================================

      - name: Checkout R1 branch
        uses: actions/checkout@v7.0.1
        with:
          ref: v2.0.0-execution-r1
          fetch-depth: 0

      # ======================================================
      # 2. VERIFY R1 CHECKOUT
      # ======================================================

      - name: Verify R1 branch and commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected branch:"
          echo "${R1_BRANCH}"

          echo
          echo "Actual commit:"
          git rev-parse HEAD

          echo
          echo "Recent commits:"
          git log -5 --oneline

          echo
          echo "Repository root:"
          pwd

          test -f package.json || {
            echo "::error::package.json was not found."
            exit 1
          }

      # ======================================================
      # 3. SET UP NODE
      # ======================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm

      # ======================================================
      # 4. INSTALL EXACT LOCKFILE DEPENDENCIES
      # ======================================================

      - name: Install dependencies from lockfile
        run: npm ci

      # ======================================================
      # 5. SECURITY AUDIT
      # ======================================================

      - name: Security audit
        run: npm audit --audit-level=high

      # ======================================================
      # 6. TYPECHECKING
      # ======================================================

      - name: Core typecheck
        run: npm run typecheck:core --if-present

      - name: Static typecheck
        run: npm run typecheck:static --if-present

      - name: Application typecheck
        run: npm run typecheck --if-present

      # ======================================================
      # 7. LINT
      # ======================================================

      - name: Lint
        run: npm run lint --if-present

      # ======================================================
      # 8. UNIT / INTEGRATION TESTS
      # ======================================================

      - name: Unit and integration tests
        run: npm run test --if-present

      # ======================================================
      # 9. CORE SMOKE
      # ======================================================

      - name: Core smoke
        run: npm run test:core --if-present

      # ======================================================
      # 10. V2 DETERMINISTIC SMOKE
      # ======================================================

      - name: V2 deterministic smoke
        run: node scripts/v2-smoke.cjs

      # ======================================================
      # 11. PRODUCTION BUILD
      # ======================================================

      - name: Production build
        run: npm run build

      # ======================================================
      # 12. PLAYWRIGHT BROWSER TESTING
      # ======================================================

      - name: Install Playwright Chromium
        if: hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        if: hashFiles('playwright.config.*') != ''
        run: npm run e2e --if-present

      # ======================================================
      # 13. INSTALL SUPABASE CLI
      #
      # Supabase setup-cli v3 is the current major release.
      # A fixed CLI version is used so the release is
      # deterministic.
      # ======================================================

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2.117.0"

      # ======================================================
      # 14. SUPABASE CREDENTIAL PREFLIGHT
      #
      # This catches the EXACT failure seen previously.
      #
      # IMPORTANT:
      # The actual token value is NEVER printed.
      # ======================================================

      - name: Validate Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Supabase credential preflight..."

          # --------------------------------------------------
          # Check token exists
          # --------------------------------------------------

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            echo "::error::Go to GitHub → Settings → Secrets and variables → Actions."
            echo "::error::Create a repository secret named exactly:"
            echo "::error::SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          # --------------------------------------------------
          # Check Supabase PAT format
          #
          # Current Supabase CLI expects personal access
          # tokens beginning with sbp_.
          # --------------------------------------------------

          if [[ ! "${SUPABASE_ACCESS_TOKEN}" =~ ^sbp_[^[:space:]]+$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is present but has the wrong format."
            echo "::error::A Supabase personal access token must begin with sbp_."
            echo "::error::Do NOT use a publishable key."
            echo "::error::Do NOT use a secret/service-role key."
            echo "::error::Do NOT use the database password."
            exit 1
          fi

          # --------------------------------------------------
          # Check database password
          # --------------------------------------------------

          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing."
            echo "::error::Create/update this repository secret before continuing."
            exit 1
          fi

          # --------------------------------------------------
          # Check project reference
          # --------------------------------------------------

          if [[ -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "::error::SUPABASE_PROJECT_ID is missing."
            echo "::error::This must contain the existing TrustPay Supabase project reference."
            exit 1
          fi

          # --------------------------------------------------
          # Check Vercel secret because later R1 stages need it
          # --------------------------------------------------

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."
            echo "::error::R1 cannot complete protected Preview smoke without it."
            exit 1
          fi

          echo "Supabase credential preflight: PASS"
          echo "Vercel automation credential preflight: PASS"

      # ======================================================
      # 15. VERIFY SUPABASE CLI VERSION
      # ======================================================

      - name: Verify Supabase CLI
        run: |
          set -euo pipefail

          supabase --version

      # ======================================================
      # 16. LINK EXISTING TRUSTPAY SUPABASE PROJECT
      #
      # Authentication is inherited from JOB-LEVEL env.
      # ======================================================

      - name: Link TrustPay Supabase project
        shell: bash
        run: |
          set -euo pipefail

          echo "Linking the configured TrustPay Supabase project..."

          supabase link \
            --project-ref "${SUPABASE_PROJECT_ID}" \
            --password "${SUPABASE_DB_PASSWORD}"

          echo "Supabase project link: PASS"

      # ======================================================
      # 17. SHOW REMOTE MIGRATION STATE
      #
      # The token is still available because it is JOB-LEVEL.
      # ======================================================

      - name: Show Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase migration state..."

          supabase migration list

      # ======================================================
      # 18. SAFE DRY RUN
      #
      # NOTHING IS APPLIED IN THIS STEP.
      # ======================================================

      - name: Supabase migration dry run
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Supabase migration dry run..."

          supabase db push --dry-run

          echo "Supabase migration dry run: PASS"

      # ======================================================
      # 19. APPLY MIGRATIONS ONLY WHEN EXPLICITLY REQUESTED
      # ======================================================

      - name: Apply Supabase migrations
        if: ${{ inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.confirm_target }}" != "TRUSTPAY-R1-SUPABASE-APPLY" ]]; then
            echo "::error::Remote migration application was requested."
            echo "::error::The required confirmation text was not supplied."
            echo "::error::Required exact value:"
            echo "::error::TRUSTPAY-R1-SUPABASE-APPLY"
            exit 1
          fi

          echo "Applying repository migrations to the configured TrustPay Supabase project..."

          supabase db push

          echo "Supabase migration apply: PASS"

      # ======================================================
      # 20. FINAL REMOTE MIGRATION STATE
      #
      # Token is still present.
      # ======================================================

      - name: Confirm final Supabase migration state
        shell: bash
        run: |
          set -euo pipefail

          echo "Confirming final Supabase migration state..."

          supabase migration list

      # ======================================================
      # 21. DATABASE LINT
      # ======================================================

      - name: Database lint
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Supabase database lint..."

          supabase db lint

          echo "Database lint: PASS"

      # ======================================================
      # 22. PROTECTED VERCEL PREVIEW SMOKE
      # ======================================================

      - name: Protected Vercel Preview smoke
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PREVIEW_URL:-}" ]]; then
            echo "::error::No Preview URL was supplied."
            exit 1
          fi

          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          preview_url = os.environ["PREVIEW_URL"].rstrip("/") + "/"
          bypass_secret = os.environ["VERCEL_AUTOMATION_BYPASS_SECRET"]

          request = urllib.request.Request(
              preview_url,
              method="GET",
              headers={
                  "x-vercel-protection-bypass": bypass_secret,
                  "x-vercel-set-bypass-cookie": "true",
                  "User-Agent": "TrustPay-R1-Preview-Smoke/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  final_url = response.geturl()
                  body = response.read(50000).decode("utf-8", "replace")

                  print("HTTP_STATUS=" + str(response.status))
                  print("FINAL_URL=" + final_url)

                  if "vercel.com/login" in final_url:
                      print(
                          "FAIL: Preview redirected to Vercel authentication."
                      )
                      sys.exit(1)

                  if response.status < 200 or response.status >= 400:
                      print(
                          "FAIL: Unexpected HTTP status:",
                          response.status
                      )
                      sys.exit(1)

                  if "TrustPay" not in body:
                      print(
                          "FAIL: Response does not appear to be the TrustPay application."
                      )
                      sys.exit(1)

                  print(
                      "PASS: Protected TrustPay Preview is reachable."
                  )

          except urllib.error.HTTPError as exc:
              print("HTTP_ERROR=" + str(exc.code))
              print(
                  exc.read(5000).decode("utf-8", "replace")
              )
              sys.exit(1)

          except urllib.error.URLError as exc:
              print("NETWORK_ERROR=" + str(exc))
              sys.exit(1)

      # ======================================================
      # 23. RELEASE EVIDENCE
      # ======================================================

      - name: Record R1 evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .r1-evidence

          R1_SHA="$(git rev-parse HEAD)"

          {
            echo "TRUSTPAY R1 RELEASE EVIDENCE"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "R1_BRANCH=${R1_BRANCH}"
            echo "R1_SHA=${R1_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "PREVIEW_URL=${{ inputs.preview_url }}"
            echo "REMOTE_MIGRATIONS_APPLIED=${{ inputs.apply_remote_migrations }}"
          } > .r1-evidence/context.txt

          echo "R1 release evidence written."

      # ======================================================
      # 24. UPLOAD RELEASE EVIDENCE
      # ======================================================

      - name: Upload R1 evidence
        uses: actions/upload-artifact@v7
        with:
          name: trustpay-r1-evidence-${{ github.run_id }}
          path: .r1-evidence/

      # ======================================================
      # 25. CREATE R1 CERTIFICATION TAG
      #
      # Only runs when:
      #
      #   1. EVERY PREVIOUS STEP PASSED
      #   2. REAL REMOTE MIGRATION APPLY WAS REQUESTED
      #
      # The tag points to the checked-out R1 commit.
      # ======================================================

      - name: Create R1 certification tag
        if: ${{ success() && inputs.apply_remote_migrations == true }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-r1"
          R1_SHA="$(git rev-parse HEAD)"

          echo "R1 certification candidate:"
          echo "Tag=${TAG}"
          echo "Commit=${R1_SHA}"

          # --------------------------------------------------
          # Check whether tag already exists remotely.
          # --------------------------------------------------

          if git ls-remote \
              --exit-code \
              --refs \
              origin \
              "refs/tags/${TAG}" \
              >/dev/null 2>&1; then

            echo "::error::Tag ${TAG} already exists."
            echo "::error::Existing release tags are never overwritten."
            exit 1
          fi

          # --------------------------------------------------
          # Configure Git identity.
          # --------------------------------------------------

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------
          # Create annotated release tag.
          # --------------------------------------------------

          git tag \
            -a "${TAG}" \
            "${R1_SHA}" \
            -m "TrustPay R1 certification ${TAG}"

          # --------------------------------------------------
          # Push tag.
          # --------------------------------------------------

          git push \
            origin \
            "refs/tags/${TAG}"

          echo
          echo "========================================"
          echo "R1 CERTIFICATION TAG CREATED"
          echo "========================================"
          echo "Tag: ${TAG}"
          echo "Commit: ${R1_SHA}"
          echo "========================================"
