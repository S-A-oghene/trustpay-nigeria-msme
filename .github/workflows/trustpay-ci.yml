name: TrustPay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trustpay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TrustPay Quality / Build / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version

      - name: Verify lockfile installation
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Repository integrity
        run: npm run verify:repo

      - name: Core typecheck
        run: npm run typecheck:core

      - name: Static typecheck
        run: npm run typecheck:static

      - name: Full typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Core smoke test
        run: npm run test:core

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E tests
        run: npm run e2e
