name: TrustPay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: trustpay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TrustPay Quality / Build / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: |
          npm install --global npm@11.19.1
          node --version
          npm --version

      - name: Verify lockfile installation
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Repository integrity
        run: npm run verify:repo

      - name: Core typecheck
        run: npm run typecheck:core

      - name: Static typecheck
        run: npm run typecheck:static

      - name: Full typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Core smoke test
        run: npm run test:core

      - name: V2 deterministic smoke
        run: npm run test:v2

      - name: R1 schema / RLS adversarial validation
        run: npm run test:r1-schema

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E tests
        run: npm run e2e

      - name: Mint GitHub OIDC token for Vercel Trusted Sources
        id: vercel_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: R1 Vercel preview smoke
        env:
          TRUSTPAY_PREVIEW_URL: https://trustpay-nigeria-msme-git-v-792fd5-eseoghenes-projects-1ef886d4.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TRUSTED_OIDC_IDP_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
        run: npm run test:r1-preview

      - name: Create R1 certification tag
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'v2.0.0-execution-r1' && github.event.pull_request.base.ref == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v2.0.0-r1';
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              if (existing.data.object.sha !== context.sha) {
                core.setFailed(`Tag ${tag} already exists at ${existing.data.object.sha}; refusing to retarget it to ${context.sha}`);
                return;
              }
              core.info(`R1 certification tag ${tag} already points to ${context.sha}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            core.info(`Created R1 certification tag ${tag} at ${context.sha}`);
